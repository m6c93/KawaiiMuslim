      const colorButton = document.getElementById("paintMoreColors");
      const colors = document.getElementById("paintExtraColors");
      const tools = document.getElementById("paintExtraTools");
      const heading = document.getElementById("paintMoreTitle");
      let opener = openButton;

        opener = button;
        colors.hidden = !colorsOnly;
        tools.hidden = colorsOnly;
        panel.dataset.panel = colorsOnly ? "colors" : "tools";
        heading.textContent = colorsOnly ? "Autres couleurs" : "Plus d’outils";
        panel.showModal();
        if (colorsOnly) colors.querySelector("[data-color]").focus();
      }
      openButton.addEventListener("click", () => openPanel(openButton, false));
      colorButton.addEventListener("click", () => openPanel(colorButton, true));
      document.getElementById("closePaintMore").addEventListener("click", () => panel.close());
      panel.addEventListener("close", () => opener.focus());
      panel.addEventListener("click", event => {
        if (event.target === panel) {
          const box = panel.getBoundingClientRect();
          if (event.clientX < box.left || event.clientX > box.right || event.clientY < box.top || event.clientY > box.bottom) panel.close();
          return;
        }
        if (event.target.closest("[data-color],[data-tool],[data-sticker],#eraserButton,#compareButton,#redoButton")) panel.close();
      });
    })();
  </script>

      const savedBookMatch = !bookColoring ? source.match(/^book-coloring:([a-z0-9-]+):page:(\d+)$/) : null;
      const savedBookTitles = {
        "bubble-tea-time-hijabi":"Bubble Tea Time Hijabi",

      };
      if (savedBookMatch && savedBookTitles[savedBookMatch[1]]) {
        const pageNumber = Number(savedBookMatch[2]);
        const resumeUrl = new URL("LivreColoriage.dc.html",location.href);
        resumeUrl.searchParams.set("book",savedBookMatch[1]);
        resumeUrl.searchParams.set("title",savedBookTitles[savedBookMatch[1]]);
        resumeUrl.searchParams.set("position",String(Math.max(0,Math.ceil(pageNumber/2))));
        resumeUrl.searchParams.set("resumePage",String(pageNumber));
        if (requestedDraft) resumeUrl.searchParams.set("resumeDraft",requestedDraft);

        location.replace(resumeUrl.pathname.split("/").pop()+resumeUrl.search);

      }
      if (bookColoring) {
        let saved = null;
        try { saved = JSON.parse(sessionStorage.getItem("km-book-coloring-page") || "null"); } catch (error) {}
        const validSaved = saved
          && saved.slug === requestedBook

          && (String(saved.imageSrc || "").startsWith("data:image/") || (() => {

          })())

        if (!validSaved) throw new Error("Rouvre cette page depuis le livre pour continuer ton coloriage.");
        imageSource = saved.imageSrc;

        bookReturnUrl = returnCandidate.origin === location.origin
          && (/\/LivreColoriage\.dc\.html$/i.test(returnCandidate.pathname)

        document.getElementById("backAction").href = bookReturnUrl;
        document.getElementById("backLabel").textContent = "Livre";
        document.body.classList.add("book-coloring-mode");
        document.querySelectorAll(".tool-label").forEach(label => {
          if (["Pression", "Stylet", "Stickers"].includes(label.textContent.trim())) label.hidden = true;
        });
      } else {
        const builtInColorings = {
"discovery-coloring:arabic:29":"./brand/books/colorie-ecris-apprends/page-029.webp",
"discovery-coloring:arabic:30":"./brand/books/colorie-ecris-apprends/page-030.webp",
"discovery-coloring:arabic:31":"./brand/books/colorie-ecris-apprends/page-031.webp",
"discovery-coloring:arabic:57":"./brand/books/colorie-ecris-apprends/page-057.webp",
"discovery-coloring:arabic:58":"./brand/books/colorie-ecris-apprends/page-058.webp",
"discovery-coloring:arabic:59":"./brand/books/colorie-ecris-apprends/page-059.webp",

          "discovery-coloring:hijabi:1":"./brand/discovery/hijabi-1.jpg",
          "discovery-coloring:hijabi:2":"./brand/discovery/hijabi-2.jpg",
          "discovery-coloring:hijabi:3":"./brand/discovery/hijabi-3.jpg",
          "builtin-coloring:lune-ramadan":"./brand/assets/coloring-lune-ramadan.png",
          "builtin-coloring:abeille-coran":"./brand/assets/coloring-abeille-coran.png",
          "builtin-coloring:tapis-priere":"./brand/assets/coloring-tapis-priere.png"
        };
        if (source.startsWith("builtin-drawing:blank") || /^discovery-coloring:arabic:solo:[123]$/.test(source)) {
          format = "blank";
          artworkSourceKey = source;
          document.body.classList.add("free-drawing-mode");
          document.getElementById("compareButton").hidden = true;
          document.getElementById("saveButton").textContent = "☁ Garder dans mon atelier";
          document.getElementById("saveStatus").textContent = "Prêt à dessiner";
        } else if (builtInColorings[source]) {
          format = "image";
          imageSource = new URL(builtInColorings[source],location.href).href;
          artworkSourceKey = source;
          if(guestMode && !source.startsWith('discovery-coloring:arabic:')){bookReturnUrl='/books/hijabi-decouverte.html?guest=1';document.getElementById('backAction').href=bookReturnUrl;document.getElementById('backLabel').textContent='Livre';}
        } else {
          sourceUrl = new URL(source);
          const valid = sourceUrl.protocol === "https:" && sourceUrl.hostname === allowedHost
            && sourceUrl.pathname.startsWith("/storage/v1/object/public/content-colorings/");
          if (!valid) throw new Error("Ce coloriage n’est pas disponible.");
          format = requestedFormat === "pdf" || sourceUrl.pathname.toLowerCase().endsWith(".pdf") ? "pdf" : "image";
          imageSource = sourceUrl.href;
          artworkSourceKey = sourceUrl.href;
        }
      }
      configureBack();
      activeTool = format === "blank" ? "marker" : "bucket";
      syncTools();
      document.title = `${title} — Kawaii Muslim`;
      document.getElementById("coloringTitle").textContent = title;
    };
    const loadBase = async () => {
      if (initialized) return;
      if (format === "pdf") {
        throw new Error("Ce coloriage PDF peut être imprimé. Pour les feutres numériques, choisis un coloriage en image.");
      } else if (format === "blank") {
        baseCanvas.width = drawCanvas.width = 1200;
        baseCanvas.height = drawCanvas.height = 1600;
        baseCtx.fillStyle = "#fff";
        baseCtx.fillRect(0,0,baseCanvas.width,baseCanvas.height);
      } else {
        const image = new Image();
        image.crossOrigin = "anonymous";
        await new Promise((resolve,reject) => {
          image.onload = resolve; image.onerror = reject; image.src = imageSource;
        });
        const scale = Math.min(1,1400 / image.naturalWidth);
        baseCanvas.width = drawCanvas.width = Math.round(image.naturalWidth * scale);
        baseCanvas.height = drawCanvas.height = Math.round(image.naturalHeight * scale);
        baseCtx.fillStyle = "#fff";
        baseCtx.fillRect(0,0,baseCanvas.width,baseCanvas.height);
        baseCtx.drawImage(image,0,0,baseCanvas.width,baseCanvas.height);
      }
      document.getElementById("loading").hidden = true;
      baseCanvas.hidden = drawCanvas.hidden = false;
      basePixels = baseCtx.getImageData(0,0,baseCanvas.width,baseCanvas.height).data;
      snapshot.width = outlineMask.width = drawCanvas.width;
      snapshot.height = outlineMask.height = drawCanvas.height;
      if (format !== "blank") {
        const mask = outlineMask.getContext("2d");
        const pixels = mask.createImageData(drawCanvas.width, drawCanvas.height);
        for (let i = 0; i < basePixels.length; i += 4) {
          if ((basePixels[i] + basePixels[i + 1] + basePixels[i + 2]) / 3 < 155) pixels.data[i + 3] = 255;
        }
        mask.putImageData(pixels, 0, 0);
      }
      initialized = true;
      await new Promise(resolve => requestAnimationFrame(resolve));
      fitPaper();
    };
    const hexToRgb = hex => {
      const value = String(hex || "#000000").replace("#","");
      return [parseInt(value.slice(0,2),16),parseInt(value.slice(2,4),16),parseInt(value.slice(4,6),16)];
    };
    const strokeStyle = stroke => {
      const tool = stroke.tool || "marker";
      const strength = Number.isFinite(stroke.pressure) ? stroke.pressure : 1;
      if (tool === "pencil") return {width:Math.max(1,stroke.size*.45),alpha:strength*.82};
      if (tool === "highlighter") return {width:stroke.size*1.8,alpha:strength*.32};
      if (tool === "brush") return {width:stroke.size*1.25,alpha:strength*.72};
      return {width:stroke.size,alpha:strength};
    };
    const paintFreehand = (ctx,stroke) => {
      if (!stroke?.points?.length) return;
      const style = strokeStyle(stroke);
      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.globalCompositeOperation = stroke.eraser ? "destination-out" : "source-over";
      ctx.strokeStyle = stroke.color;
      const [first,...rest] = stroke.points;
      if (!stroke.dynamic) {
        ctx.lineWidth = style.width;
        ctx.globalAlpha = stroke.eraser ? 1 : style.alpha;
        ctx.beginPath();
        ctx.moveTo(first[0],first[1]);
        if (!rest.length) ctx.lineTo(first[0]+.1,first[1]+.1);
        rest.forEach(point => ctx.lineTo(point[0],point[1]));
        ctx.stroke();
      } else {
        const sensitivity = Number.isFinite(stroke.sensitivity) ? stroke.sensitivity : 1.55;
        const pressureFactor = value => Math.max(.3,Math.min(1.8,1+(value-.5)*1.35*sensitivity));
        if (!rest.length) {
          const penPressure = Number.isFinite(first[2]) ? first[2] : .5;
          ctx.lineWidth = style.width*pressureFactor(penPressure);
          ctx.globalAlpha = stroke.eraser ? 1 : Math.min(1,style.alpha*(.65+penPressure*.7));
          ctx.beginPath();
          ctx.moveTo(first[0],first[1]);
          ctx.lineTo(first[0]+.1,first[1]+.1);
          ctx.stroke();
        } else {
          let previous = first;
          rest.forEach(point => {
            const penPressure = ((Number.isFinite(previous[2]) ? previous[2] : .5)+(Number.isFinite(point[2]) ? point[2] : .5))/2;
            ctx.lineWidth = style.width*pressureFactor(penPressure);
            ctx.globalAlpha = stroke.eraser ? 1 : Math.min(1,style.alpha*(.65+penPressure*.7));
            ctx.beginPath();
            ctx.moveTo(previous[0],previous[1]);
            ctx.lineTo(point[0],point[1]);
            ctx.stroke();
            previous = point;
          });
        }
      }
      ctx.restore();
    };
    const applyBucket = action => {
      const width = drawCanvas.width;
      const height = drawCanvas.height;
      const fill = hexToRgb(action.color);
      const fillAlpha = Math.round(255*(Number.isFinite(action.pressure) ? action.pressure : .55));
      const overlay = drawCtx.getImageData(0,0,width,height);
      const paintRuns = runs => {
        runs.forEach(([start,end]) => {
          for (let index=start;index<=end;index++) {
            const p = index*4;
            overlay.data[p] = fill[0];
            overlay.data[p+1] = fill[1];
            overlay.data[p+2] = fill[2];
            overlay.data[p+3] = fillAlpha;
          }
        });
        drawCtx.putImageData(overlay,0,0);
      };
      if (action._runs) return paintRuns(action._runs);
      const sx = Math.max(0,Math.min(width-1,Math.round(action.x)));
      const sy = Math.max(0,Math.min(height-1,Math.round(action.y)));
      const composite = document.createElement("canvas");
      composite.width = width; composite.height = height;
      const compositeCtx = composite.getContext("2d",{willReadFrequently:true});
      compositeCtx.drawImage(baseCanvas,0,0);
      compositeCtx.drawImage(drawCanvas,0,0);
      const sourceData = compositeCtx.getImageData(0,0,width,height).data;
      const start = (sy*width+sx)*4;
      const target = [sourceData[start],sourceData[start+1],sourceData[start+2]];
      if ((target[0]+target[1]+target[2])/3 < 70) return;
      const tolerance = 34;
      const visited = new Uint8Array(width*height);
      const stack = [[sx,sy]];
      const runs = [];
      const matches = (x,y) => {
        if (x < 0 || y < 0 || x >= width || y >= height) return false;
        const index = y*width+x;
        if (visited[index]) return false;
        const p = index*4;
        return Math.abs(sourceData[p]-target[0]) <= tolerance
          && Math.abs(sourceData[p+1]-target[1]) <= tolerance
          && Math.abs(sourceData[p+2]-target[2]) <= tolerance;
      };
      while (stack.length) {
        const [seedX,y] = stack.pop();
        let x = seedX;
        while (x >= 0 && matches(x,y)) x--;
        x++;
        const runStart = x;
        let spanUp = false;
        let spanDown = false;
        for (; x < width && matches(x,y); x++) {
          const index = y*width+x;
          visited[index] = 1;
          const p = index*4;
          overlay.data[p] = fill[0];
          overlay.data[p+1] = fill[1];
          overlay.data[p+2] = fill[2];
          overlay.data[p+3] = fillAlpha;
          if (y > 0) {
            if (matches(x,y-1)) {
              if (!spanUp) stack.push([x,y-1]);
              spanUp = true;
            } else spanUp = false;
          }
          if (y < height-1) {
            if (matches(x,y+1)) {
              if (!spanDown) stack.push([x,y+1]);
              spanDown = true;
            } else spanDown = false;
          }
        }
        if (x > runStart) runs.push([y*width+runStart,y*width+x-1]);
      }
      Object.defineProperty(action,"_runs",{value:runs,writable:true,configurable:true});
      drawCtx.putImageData(overlay,0,0);
    };
    const drawStroke = stroke => {
      if (!stroke) return;
      if (stroke.type === "fill") return applyBucket(stroke);
      if (stroke.type === "sticker") {
        drawCtx.save();
        drawCtx.globalAlpha = Number.isFinite(stroke.pressure) ? stroke.pressure : 1;
        drawCtx.font = `${stroke.size}px "Apple Color Emoji","Segoe UI Emoji",sans-serif`;
        drawCtx.textAlign = "center";
        drawCtx.textBaseline = "middle";
        drawCtx.fillText(stroke.emoji,stroke.x,stroke.y);
        drawCtx.restore();
        return;
      }
      paintFreehand(drawCtx,stroke);
    };
    const protectContours = (force=false) => {
      if (!basePixels || format === "blank" || (!force && !safeMode)) return;
      drawCtx.save(); drawCtx.globalCompositeOperation = "destination-out";
      drawCtx.drawImage(outlineMask, 0, 0); drawCtx.restore();
    };
    const redraw = () => {
      drawCtx.clearRect(0,0,drawCanvas.width,drawCanvas.height);
      strokes.forEach(drawStroke);
      protectContours();
    };
    const pointFromEvent = event => {
      const rect = drawCanvas.getBoundingClientRect();
      const penPressure = event.pointerType === "pen" && event.pressure > 0 ? event.pressure : .5;
      return [
        (event.clientX-rect.left)*drawCanvas.width/rect.width,
        (event.clientY-rect.top)*drawCanvas.height/rect.height,
        penPressure
      ];
    };
    const guestKey = () => "km-guest-coloring:" + artworkSourceKey;
    const finishedKey = id => "km-finished-coloring:" + id;
    const recoveryKey = () => "km-coloring-recovery:" + context.user.id + ":" + childId + ":" + artworkSourceKey;
    const readRecord = key => {
      try { return JSON.parse(localStorage.getItem(key) || "null"); } catch { return null; }
    };
    const record = () => ({id:draftId, childId, writeSession, strokes, title, updatedAt:new Date().toISOString()});
    function archiveFinished(artwork) {
      const sourceKey = guestKey(), raw = localStorage.getItem(sourceKey);
      const active = raw && JSON.parse(raw);
      const id = artwork.id || "legacy-" + artworkSourceKey + ":" + (artwork.updatedAt || "completed");
      const key = finishedKey(id);
      if (localStorage.getItem(key) === null) {
        localStorage.setItem(key, JSON.stringify({...artwork,id,sourceUrl:artworkSourceKey,status:"completed"}));
      }
      // Prefer an existing gallery copy (it may already have a new title). Delete
      // the matching draft only after ensuring that its completed copy exists.
      if (active && active.id === artwork.id && localStorage.getItem(sourceKey) === raw) localStorage.removeItem(sourceKey);
    }
    function checkpoint() {
      if (deviceOnly) {
        if (!draftId || localStorage.getItem(finishedKey(draftId)) !== null) draftId = "guest-" + deviceDraftId();
        localStorage.setItem(guestKey(), JSON.stringify({...record(), status:"in_progress"}));
      } else {
        localStorage.setItem(recoveryKey(), JSON.stringify(record()));
      }
    }
    function scheduleSave() {
      revision++;
      try {
        checkpoint();
        if (deviceOnly) {
          savedRevision = revision;
          saveStatus.textContent = "Sauvegardé sur cet appareil";
          return;
        }
      } catch { /* The remote save can still succeed when the device storage is full. */ }
      clearTimeout(saveTimer);
      saveStatus.textContent = "Sauvegarde…";
      saveTimer = setTimeout(() => saveDraft().catch(() => {}), 650);
    }
    async function flushDraft() {
      while (savedRevision < revision) {
        const pending = revision;
        if (deviceOnly) {
          checkpoint();
        } else {
          const drawingData = {version:2, width:drawCanvas.width, height:drawCanvas.height, strokes:structuredClone(strokes)};
          const saved = await KMAuth.saveArtworkDraft({id:draftId,childId,title,sourceUrl:artworkSourceKey,drawingData});
          draftId = saved.id;
          try {
            if (pending !== revision) checkpoint();
            else if (readRecord(recoveryKey())?.writeSession === writeSession) localStorage.removeItem(recoveryKey());
          } catch {}
        }
        savedRevision = pending;
      }
      saveStatus.textContent = deviceOnly ? "Sauvegardé sur cet appareil" : "Sauvegardé dans ton atelier";
    }
    function saveDraft() {
      clearTimeout(saveTimer); saveTimer = null;
      if (savePromise) return savePromise;
      savePromise = flushDraft().catch(error => {
        saveStatus.textContent = "Sauvegarde à réessayer";
        throw error;
      }).finally(() => { savePromise = null; });
      return savePromise;
    }
    async function loadDraft() {
      const recovery = readRecord(deviceOnly ? guestKey() : recoveryKey());
      if (deviceOnly && recovery?.status === "completed") {
        archiveFinished(recovery);
        return;
      }
      let draft = null;
      if (!deviceOnly) {
        try { draft = await KMAuth.findArtworkDraft({childId,sourceUrl:artworkSourceKey}); }
        catch (error) { if (!recovery) throw error; }
      }
      const useLocal = recovery && Array.isArray(recovery.strokes) && (deviceOnly || !draft ||
        ((!recovery.id || recovery.id === draft.id) && Date.parse(recovery.updatedAt) >= Date.parse(draft.updated_at)));
      if (useLocal) {
        strokes = recovery.strokes;
        draftId = deviceOnly ? recovery.id : (draft?.id || "");
        savedRevision = deviceOnly ? revision : -1;
      } else if (draft) {
        draftId = draft.id;
        strokes = Array.isArray(draft.drawing_data?.strokes) ? draft.drawing_data.strokes : [];
        savedRevision = revision;
      } else { return; }
      redraw();
      saveStatus.textContent = "Dessin retrouvé";
      if (useLocal && !deviceOnly) saveDraft().catch(() => {});
    }
    const mergedDataUrl = () => {
      const output = document.createElement("canvas");
      output.width = baseCanvas.width; output.height = baseCanvas.height;
      const ctx = output.getContext("2d");
      ctx.drawImage(baseCanvas,0,0); ctx.drawImage(drawCanvas,0,0);
      return output.toDataURL("image/png");
    };
    const mergedBlob = async () => {
      const output = document.createElement("canvas");
      output.width = baseCanvas.width; output.height = baseCanvas.height;
      const ctx = output.getContext("2d");
      ctx.drawImage(baseCanvas,0,0); ctx.drawImage(drawCanvas,0,0);
      return new Promise(resolve => output.toBlob(resolve,"image/png"));
    };
    const printCurrent = async originalOnly => {
      if (format === "pdf") {
        window.open(sourceUrl.href,"_blank","noopener");
        return;
      }
      await loadBase();
      document.getElementById("printOutput").src = originalOnly ? baseCanvas.toDataURL("image/png") : mergedDataUrl();
      setTimeout(() => window.print(),80);
    };
    const startEditor = async () => {
      childId = childSelect.value;
      if (!childId) {
        const childName = document.getElementById("quickChildName").value.trim();
        if (!childName) {
          document.getElementById("choiceMessage").textContent = "Écris d’abord le prénom du petit artiste.";
          document.getElementById("quickChildName").focus();
          return;
        }
        const child = await KMAuth.addChild({ name:childName, avatar:"🐤", ageGroup:"6-8" });
        childId = child.id;
        childSelect.replaceChildren(new Option((child.avatar || "") + " " + child.name, child.id));
        childSelect.value = child.id;
        KMAuth.setActiveProfile({type:"child",id:child.id,name:child.name,avatar:child.avatar});
      }
      if (format === "pdf") {
        document.documentElement.classList.remove("direct-coloring");
        document.getElementById("choiceMessage").textContent = "Ce fichier PDF est prêt à imprimer. Choisis un coloriage en image pour utiliser les feutres numériques.";
        return;
      }
      choice.hidden = true;
      editorApp.hidden = false;
      await loadBase();
      await loadDraft();
      editingReady = true;
      if (!params.has("embed")) window.KMActivityProgress?.remember("/Atelier.dc.html#galerie",title);
      if (bookColoring && choice.isConnected) {
        choice.remove();
        document.documentElement.scrollTop = 0;
        document.body.scrollTop = 0;
      }
    };

    function fitPaper() {
      if (!initialized || !stage.clientWidth || !stage.clientHeight) return;
      const style = getComputedStyle(stage);
      const width = stage.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
      const height = stage.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);
      basePaperWidth = Math.min(width, height * baseCanvas.width / baseCanvas.height);
      setZoom(zoom);
    }
    const setZoom = value => {
      zoom = Math.max(.75,Math.min(2.5,value));
      if (basePaperWidth) paper.style.width = `${Math.round(basePaperWidth*zoom)}px`;
      document.getElementById("zoomValue").value = `${Math.round(zoom*100)}%`;
    };
    const pointerDistance = () => {
      const points = [...activePointers.values()];
      return points.length < 2 ? 0 : Math.hypot(points[0].x-points[1].x,points[0].y-points[1].y);
    };
    const nearbySticker = point => {
      const radius = Math.max(35,size*3);
      return [...strokes].reverse().find(item => item.type === "sticker" && Math.hypot(item.x-point[0],item.y-point[1]) <= Math.max(radius,item.size*.6));
    };
    function cancelGesture() {
      currentStroke = null;
      pendingTap = null;
      if (movingSticker && stickerOrigin) {
        movingSticker.x = stickerOrigin.x; movingSticker.y = stickerOrigin.y;
      }
      movingSticker = null; stickerOrigin = null; activePointer = null;
      redraw();
    }
    drawCanvas.addEventListener("pointerdown", event => {
      if (!editingReady || finishing || event.button !== 0) return;
      event.preventDefault();
      try { drawCanvas.setPointerCapture(event.pointerId); } catch {}
      activePointers.set(event.pointerId, {x:event.clientX,y:event.clientY});
      if (activePointers.size === 2) {
        cancelGesture(); pinching = true;
        pinchStartDistance = pointerDistance(); pinchStartZoom = zoom;
      }
      if (pinching || activePointers.size !== 1) return;
      const point = pointFromEvent(event);
      activePointer = event.pointerId;
      if (activeTool === "bucket" && !erasing) {
        pendingTap = {type:"fill",x:point[0],y:point[1],color,pressure,safe:safeMode};
        return;
      }
      if (activeTool === "sticker" && !erasing) {
        movingSticker = nearbySticker(point);
        if (movingSticker) stickerOrigin = {x:movingSticker.x, y:movingSticker.y};
        else pendingTap = {type:"sticker",emoji:activeSticker,x:point[0],y:point[1],size:Math.max(30,size*3),pressure};
        return;
      }
      currentStroke = {type:"stroke",tool:erasing ? "eraser" : activeTool,color,size,pressure,
        safe:safeMode,eraser:erasing,dynamic:event.pointerType === "pen",sensitivity:stylusSensitivity,points:[point]};
      const cache = snapshot.getContext("2d");
      cache.clearRect(0,0,snapshot.width,snapshot.height); cache.drawImage(drawCanvas,0,0);
      drawStroke(currentStroke);
    });
    let drawFrame = 0;
    function paintGesture() {
      drawFrame = 0;
      if (movingSticker) { redraw(); return; }
      if (!currentStroke) return;
      drawCtx.clearRect(0,0,drawCanvas.width,drawCanvas.height); drawCtx.drawImage(snapshot,0,0);
      drawStroke(currentStroke); protectContours(currentStroke.safe);
    }
    drawCanvas.addEventListener("pointermove", event => {
      if (!activePointers.has(event.pointerId)) return;
      activePointers.set(event.pointerId,{x:event.clientX,y:event.clientY});
      if (pinching && activePointers.size >= 2) {
        event.preventDefault(); if (pinchStartDistance) setZoom(pinchStartZoom * pointerDistance() / pinchStartDistance);
        return;
      }
      if (event.pointerId !== activePointer) return;
      event.preventDefault();
      if (movingSticker) {
        const point = pointFromEvent(event); movingSticker.x=point[0]; movingSticker.y=point[1];
      } else if (pendingTap?.type === "sticker") {
        const point = pointFromEvent(event); pendingTap.x=point[0]; pendingTap.y=point[1]; return;
      } else if (currentStroke) {
        const samples = event.getCoalescedEvents?.() || [];
        for (const sample of (samples.length ? samples : [event])) currentStroke.points.push(pointFromEvent(sample));
      } else return;
      if (!drawFrame) drawFrame = requestAnimationFrame(paintGesture);
    });
    function endStroke(event) {
      if (!activePointers.delete(event.pointerId)) return;
      if (pinching) { if (!activePointers.size) pinching=false; return; }
      if (event.pointerId !== activePointer) return;
      cancelAnimationFrame(drawFrame); drawFrame=0;
      if (event.type !== "pointerup") { cancelGesture(); return; }
      const action = pendingTap || currentStroke;
      if (action) {
        if (currentStroke && currentStroke.points.length > 1) currentStroke.points.push(pointFromEvent(event));
        strokes.push(action);
        if (action.type === "sticker") selectedSticker = action;
      } else if (movingSticker) selectedSticker = movingSticker;
      else return;
      pendingTap=null; currentStroke=null; movingSticker=null; stickerOrigin=null; activePointer=null;
      redoStack=[]; redraw(); scheduleSave();
    }
    drawCanvas.addEventListener("pointerup",endStroke);
    drawCanvas.addEventListener("pointercancel",endStroke);
    drawCanvas.addEventListener("lostpointercapture",endStroke);
    editorApp.addEventListener("click",event => {
      const button = event.target.closest("[data-color]");
      if (!button) return;
      color = button.dataset.color; erasing = false;
      syncTools();
      document.getElementById("eraserButton").classList.remove("active");
    });
    document.getElementById("customColor").addEventListener("input",event => {
      color = event.target.value;
      erasing = false;
      syncTools();
      document.getElementById("eraserButton").classList.remove("active");
    });
    editorApp.addEventListener("click",event => {
      const button = event.target.closest("[data-tool]");
      if (!button) return;
      activeTool = button.dataset.tool;
      erasing = false;
      syncTools();
      document.getElementById("eraserButton").classList.remove("active");
      if (activeTool === "bucket") toast("Touche une zone à remplir 🪣");
      if (activeTool === "sticker") toast("Touche le dessin pour placer ton sticker 🌟");
    });
    function syncTools() {
      for (const button of editorApp.querySelectorAll("[data-tool],[data-color],#eraserButton")) {
        const active = button.dataset.tool ? !erasing && button.dataset.tool === activeTool :
          button.dataset.color ? button.dataset.color.toLowerCase() === color.toLowerCase() : erasing;
        button.classList.toggle("active", active);
        button.setAttribute("aria-pressed", String(active));
      }
    }
    document.getElementById("stickers").addEventListener("click",event => {
      const button = event.target.closest("[data-sticker]");
      if (!button) return;
      activeSticker = button.dataset.sticker;
      activeTool = "sticker";
      erasing = false;
      if (selectedSticker) {
        selectedSticker.emoji = activeSticker;
        redraw();
        scheduleSave();
      }
      document.querySelectorAll("[data-sticker]").forEach(item => item.classList.toggle("active",item===button));
      syncTools();
      document.getElementById("eraserButton").classList.remove("active");
    });
    document.querySelector(".sizes").addEventListener("click",event => {
      const button = event.target.closest("[data-size]");
      if (!button) return;
      size = Number(button.dataset.size);
      if (activeTool === "sticker" && selectedSticker) {
        selectedSticker.size = Math.max(30,size*3);
        redraw();
        scheduleSave();
      }
      document.querySelectorAll("[data-size]").forEach(item => item.classList.toggle("active",item===button));
    });
    document.getElementById("pressureRange").addEventListener("input",event => {
      pressure = Number(event.target.value) / 100;
      document.getElementById("pressureLabel").textContent =
        pressure <= .35 ? "Toute douce" : pressure <= .7 ? "Normale" : "Bien marquée";
    });
    document.getElementById("stylusSensitivity").addEventListener("input",event => {
      stylusSensitivity = Number(event.target.value) / 100;
      document.getElementById("stylusSensitivityLabel").textContent =
        stylusSensitivity < 1.15 ? `Douce ${event.target.value}%`
        : stylusSensitivity < 1.65 ? `Sensible ${event.target.value}%`
        : `Très sensible ${event.target.value}%`;
    });
    document.getElementById("safeModeButton").addEventListener("click",event => {
      safeMode = !safeMode;
      event.currentTarget.classList.toggle("active",safeMode);
      event.currentTarget.innerHTML = safeMode ? "🛡️<br>Contours" : "🛡️<br>Libres";
      toast(safeMode ? "Les contours noirs sont protégés" : "Coloriage libre activé");
    });
    document.getElementById("eraserButton").addEventListener("click",event => {
      erasing = !erasing; syncTools();
    });
    document.getElementById("undoButton").addEventListener("click",() => {
      const stroke = strokes.pop(); if (!stroke) return;
      redoStack.push(stroke); redraw(); scheduleSave();
    });
    document.getElementById("redoButton").addEventListener("click",() => {
      const stroke = redoStack.pop(); if (!stroke) return;
      strokes.push(stroke); redraw(); scheduleSave();
    });
    document.getElementById("compareButton").addEventListener("click",event => {
      const showingBefore = drawCanvas.hidden;
      drawCanvas.hidden = !showingBefore;
      event.currentTarget.textContent = showingBefore ? "👀 Avant" : "🎨 Après";
      toast(showingBefore ? "Voici ton coloriage" : "Voici le dessin original");
    });
    document.getElementById("zoomIn").addEventListener("click",() => setZoom(zoom+.2));
    document.getElementById("zoomOut").addEventListener("click",() => setZoom(zoom-.2));
    window.addEventListener("resize",fitPaper);
    if (window.ResizeObserver) new ResizeObserver(fitPaper).observe(stage);
    document.getElementById("clearButton").addEventListener("click",() => {
      if (!strokes.length || !confirm("Effacer tous les feutres et recommencer ?")) return;
      redoStack = [...strokes].reverse(); strokes=[]; redraw(); scheduleSave();
    });
    document.getElementById("saveButton").addEventListener("click",async event => {
      const button = event.currentTarget;
      try {
        button.disabled = true;
        button.textContent = format === "blank" ? "☁ Sauvegarde…" : "☁ Sauvegarde…";
        await saveDraft();
        if (format === "blank" && !guestMode && !localDesignPreview) {
          await KMAuth.saveArtworkPreview({id:draftId,childId,imageBlob:await mergedBlob()});
          saveStatus.textContent = "Dessin sauvegardé dans mon atelier";
          toast("Ton dessin est dans ton atelier 🎨");
          window.setTimeout(() => {
            window.location.href = `Atelier.dc.html?child=${encodeURIComponent(childId)}&saved=1`;
          },700);
          return;
        }
        toast(format === "blank" ? "Ton dessin est bien gardé ☁️" : "Ton coloriage est bien gardé ☁️");
      } catch (error) {
        toast(KMAuth.friendlyError(error));
      } finally {
        button.disabled = false;
        button.textContent = format === "blank" ? "☁ Garder dans mon atelier" : "☁ Sauvegarder";
      }
    });
    document.getElementById("printButton").addEventListener("click",() => printCurrent(false));
    document.getElementById("quickPrint").addEventListener("click",() => printCurrent(true));
    document.getElementById("startColoring").addEventListener("click",() => startEditor().catch(error => {
      editorApp.hidden = true;
      choice.hidden = false;
      document.getElementById("choiceMessage").textContent=KMAuth.friendlyError(error);
    }));
    function guestThumbnail() {
      const thumb = document.createElement("canvas");
      const scale = Math.min(1, 420 / Math.max(drawCanvas.width, drawCanvas.height));
      thumb.width = Math.round(drawCanvas.width * scale); thumb.height = Math.round(drawCanvas.height * scale);
      const ctx = thumb.getContext("2d");
      for (const canvas of [baseCanvas,drawCanvas]) ctx.drawImage(canvas,0,0,thumb.width,thumb.height);
      return thumb.toDataURL("image/jpeg", .82);
    }
    document.getElementById("finishButton").addEventListener("click", async event => {
      if (!editingReady || finishing) return;
      finishing = true;
      const button = event.currentTarget;
      button.disabled = true; button.setAttribute("aria-busy","true");
      editorApp.inert = true;
      try {
        await saveDraft();
        const target = new URL("Atelier.dc.html", location.href);
        if (!guestMode) {
          target.searchParams.set("child", childId);
          try { sessionStorage.setItem("km-atelier-return-child",childId); } catch {}
        }
        if (localDesignPreview) target.searchParams.set("preview","1");
        if (deviceOnly) {
          archiveFinished({...record(),imageUrl:guestThumbnail()});
          if (guestMode) target.searchParams.set("guest","1");
        } else {
          const memory = {title, childName:context.children.find(c=>c.id===childId)?.name || "",date:new Date().toISOString()};
          await KMAuth.completeArtwork({id:draftId,childId,imageBlob:await mergedBlob(),
            drawingData:{version:2,width:drawCanvas.width,height:drawCanvas.height,strokes,memory}});
          await KMAuth.awardChildStars({childId,eventType:"activity_complete",sourceKey:bookColoring ? artworkSourceKey : "coloring:"+draftId,
            description:"Coloriage terminé : "+title}).catch(() => {});
        }
        target.searchParams.set("celebrated","1"); target.hash="galerie";
        location.assign(target.href);
      } catch (error) {
        finishing=false; editorApp.inert=false; button.disabled=false; button.removeAttribute("aria-busy");
        saveStatus.textContent="Enregistrement à réessayer"; toast(KMAuth.friendlyError(error));
      }
    });
    function flushOnLeave() {
      if (!finishing && editingReady && revision > 0 && revision > savedRevision) saveDraft().catch(() => {});
    }
    document.getElementById("backAction").addEventListener("click",async event => {
      if (event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
      const back=event.currentTarget, url=new URL(back.href);
      if (url.pathname.includes("Atelier") && !guestMode && childId) {
        url.searchParams.set("child",childId);
        try {sessionStorage.setItem("km-atelier-return-child",childId);} catch {}
        back.href=url.href;
      }
      if (!editingReady || revision === 0 || savedRevision >= revision) return;
      event.preventDefault();
      try { await saveDraft(); location.assign(url.href); }
      catch (error) { toast(KMAuth.friendlyError(error)); }
    });
    window.addEventListener("pagehide",flushOnLeave);
    document.addEventListener("visibilitychange",()=>{if(document.hidden)flushOnLeave();});

    try {
      validateSource();
      context = guestMode || localDesignPreview
        ? {profile:{role:"guest"},children:[{id:guestMode?"guest-child":"preview-child",name:"Découverte",avatar:"🎨"}]}
        : await KMAuth.getContext();
      if (!context) {
        window.location.replace(`Connexion.dc.html?next=${encodeURIComponent(location.pathname+location.search)}`);
      } else {
        const active = guestMode || localDesignPreview
          ? {type:"child",id:requestedChild || "guest-child",name:"Découverte",avatar:"🎨"}
          : KMAuth.getActiveProfile();
        const activeChild = active.type === "child" ? context.children.find(child => child.id === active.id) : null;
        const children = activeChild ? [activeChild] : context.children;
        childSelect.replaceChildren(...children.map(child => new Option((child.avatar || "") + " " + child.name, child.id)));
        if (activeChild) childSelect.value = activeChild.id;
        else if (children.some(child => child.id === requestedChild)) childSelect.value = requestedChild;
        if (!context.children.length) {
          document.documentElement.classList.remove("direct-coloring");
          childSelect.hidden = true;
          document.getElementById("quickChild").hidden = false;
          document.getElementById("choiceMessage").textContent = "Une seule fois : indique son prénom pour créer sa galerie privée.";
        }
        if ((params.get("atelier") === "1" || source.startsWith("discovery-coloring:") || requestedDraft || bookColoring || source.startsWith("builtin-drawing:blank") || params.get("embed") === "1") && childSelect.value) await startEditor();
      }
    } catch (error) {
      if (error?.message !== "book_redirect") {
        document.documentElement.classList.remove("direct-coloring");
        editorApp.hidden = true;
        choice.hidden = false;
        document.getElementById("choiceMessage").textContent = KMAuth.friendlyError(error);
        document.getElementById("startColoring").disabled = true;
        document.getElementById("quickPrint").disabled = true;
      }
    }
  </script>
</body>
</html>
