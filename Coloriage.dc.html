<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#211e56">
  <title>Coloriage — Kawaii Muslim</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme:light; --night:#211e56; --ink:#34345e; --muted:#767894; --mint:#4fc0a1; --pink:#e789b6; --gold:#f0b53f; }
    * { box-sizing:border-box; }
    html,body { min-width:100%; min-height:100%; margin:0; }
    body { color:#fff; font-family:"Nunito",sans-serif; background:#17143e; overscroll-behavior:none; }
    button,select { font:inherit; }
    button,a { -webkit-tap-highlight-color:transparent; }
    [hidden] { display:none!important; }
    .app { min-height:100dvh; display:grid; grid-template-rows:auto minmax(0,1fr); background:
      radial-gradient(circle at 10% 16%,rgba(231,137,182,.16),transparent 25%),
      radial-gradient(circle at 88% 75%,rgba(79,192,161,.14),transparent 25%),
      linear-gradient(145deg,#17143e,#302968 60%,#211e56); }
    .topbar { position:sticky; top:0; z-index:20; min-height:68px; display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:12px; padding:calc(9px + env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 9px max(12px,env(safe-area-inset-left)); border-bottom:1px solid rgba(255,255,255,.1); background:rgba(25,22,63,.92); backdrop-filter:blur(14px); }
    .title { min-width:0; text-align:center; }
    .title strong { display:block; overflow:hidden; font:800 clamp(16px,3vw,22px)/1.1 "Baloo 2",cursive; text-overflow:ellipsis; white-space:nowrap; }
    .title small { color:#d6d3ed; font-size:10px; }
    .top-actions { display:flex; gap:7px; }
    .action { cursor:pointer; min-height:42px; display:inline-flex; align-items:center; justify-content:center; gap:7px; padding:9px 13px; color:#fff; border:1px solid rgba(255,255,255,.18); border-radius:14px; background:rgba(255,255,255,.1); text-decoration:none; font-size:11px; font-weight:900; }
    .action.primary { border:0; background:linear-gradient(135deg,#66ccb0,#3bac8d); }
    .workspace { min-height:0; display:grid; grid-template-columns:94px minmax(0,1fr); }
    .tools { position:sticky; top:68px; z-index:12; height:calc(100dvh - 68px); overflow:auto; display:flex; flex-direction:column; align-items:center; gap:10px; padding:14px 10px max(14px,env(safe-area-inset-bottom)); border-right:1px solid rgba(255,255,255,.1); background:rgba(22,19,57,.72); }
    .tool-label { color:#c9c8de; font-size:9px; font-weight:900; text-transform:uppercase; }
    .palette { display:grid; grid-template-columns:repeat(2,34px); gap:8px; }
    .color { cursor:pointer; width:34px; height:34px; border:3px solid rgba(255,255,255,.25); border-radius:50%; background:var(--color); box-shadow:0 4px 10px rgba(0,0,0,.18); }
    .color.active { border-color:#fff; transform:scale(1.12); }
    .tool { cursor:pointer; width:66px; min-height:44px; display:grid; place-items:center; padding:6px; color:#fff; border:1px solid rgba(255,255,255,.14); border-radius:14px; background:rgba(255,255,255,.08); font-size:10px; font-weight:900; text-align:center; }
    .tool.active { color:#2d6658; border-color:#a5ead7; background:#dff8ef; }
    .sizes { display:flex; align-items:center; gap:6px; }
    .size { cursor:pointer; width:24px; height:24px; display:grid; place-items:center; border:0; border-radius:50%; background:rgba(255,255,255,.09); }
    .size::after { content:""; width:var(--dot); height:var(--dot); border-radius:50%; background:#fff; }
    .size.active { outline:2px solid var(--gold); }
    .stage { min-width:0; min-height:0; overflow:auto; display:grid; place-items:start center; padding:clamp(12px,3vw,30px); touch-action:pan-x pan-y; }
    .paper { position:relative; width:min(820px,100%); overflow:hidden; border-radius:13px; background:#fff; box-shadow:0 26px 70px rgba(5,4,24,.5); touch-action:none; }
    .paper canvas { display:block; width:100%; height:auto; }
    #drawCanvas { position:absolute; inset:0; z-index:2; }
    .loading { min-height:70dvh; display:grid; place-items:center; color:var(--ink); background:#f8f6fb; text-align:center; }
    .loading span { display:block; margin-bottom:8px; font-size:42px; }
    .finish { margin-top:auto; color:#fff; border:0; background:linear-gradient(145deg,var(--pink),#cf6898); box-shadow:0 9px 20px rgba(231,137,182,.26); }
    .choice { position:fixed; inset:0; z-index:50; display:grid; place-items:center; padding:20px; background:radial-gradient(120% 90% at 50% 0,#36449a,#171a40 72%); }
    .choice-card { width:min(700px,100%); padding:clamp(25px,5vw,45px); border:1px solid rgba(255,255,255,.14); border-radius:30px; background:rgba(255,255,255,.08); box-shadow:0 35px 90px rgba(0,0,0,.35); text-align:center; backdrop-filter:blur(12px); }
    .mascot { width:75px; height:75px; margin:0 auto 15px; overflow:hidden; border:3px solid #fff; border-radius:50%; background:#fff; }
    .mascot img { width:92px; margin-left:-8px; margin-top:4px; }
    .choice h1 { margin:0; font:800 clamp(31px,6vw,46px)/1 "Baloo 2",cursive; }
    .choice p { margin:8px auto 24px; color:#d5d8ed; font-size:13px; }
    .choice-buttons { display:grid; grid-template-columns:1fr 1fr; gap:13px; }
    .choice-button { cursor:pointer; min-height:135px; padding:20px; color:var(--ink); border:0; border-radius:24px; background:#fff; }
    .choice-button span { display:block; margin-bottom:8px; font-size:37px; }
    .choice-button strong { display:block; font:800 21px "Baloo 2",cursive; }
    .choice-button small { color:var(--muted); }
    .child-select { width:min(330px,100%); min-height:46px; margin:0 auto 16px; padding:10px 14px; color:var(--ink); border:0; border-radius:14px; background:#fff; font-weight:800; }
    .choice-message { min-height:18px; margin-top:12px; color:#ffd1e4; font-size:11px; font-weight:900; }
    #printOutput { display:none; }
    .toast { position:fixed; right:16px; bottom:16px; z-index:30; max-width:290px; padding:11px 15px; color:var(--ink); border-radius:16px; background:#fff; box-shadow:0 12px 30px rgba(0,0,0,.2); font-size:11px; font-weight:900; transition:.2s; }
    @media (max-width:700px) {
      .topbar { grid-template-columns:auto minmax(0,1fr); }
      .top-actions { grid-column:1/-1; display:grid; grid-template-columns:1fr 1fr 1fr; }
      .home-label,.title small { display:none; }
      .workspace { grid-template-columns:1fr; grid-template-rows:minmax(0,1fr) auto; }
      .stage { grid-row:1; padding:10px 8px; }
      .tools { position:sticky; bottom:0; top:auto; grid-row:2; width:100%; height:auto; overflow-x:auto; flex-direction:row; justify-content:flex-start; padding:9px max(10px,env(safe-area-inset-right)) calc(9px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left)); border-top:1px solid rgba(255,255,255,.12); border-right:0; background:rgba(22,19,57,.95); }
      .tool-label { display:none; }
      .palette { flex:0 0 auto; display:flex; }
      .finish { margin:0 0 0 auto; }
      .choice-buttons { grid-template-columns:1fr; }
      .choice-button { min-height:105px; }
    }
    @media print {
      @page { size:auto; margin:8mm; }
      body { background:#fff; }
      .app,.choice,.toast { display:none!important; }
      #printOutput { width:100%; max-height:calc(100vh - 16mm); display:block!important; object-fit:contain; }
    }
  </style>
</head>
<body>
  <main class="app" id="editorApp" hidden>
    <header class="topbar">
      <a class="action" href="Atelier.dc.html"><span>⌂</span><span class="home-label">Atelier</span></a>
      <div class="title"><strong id="coloringTitle">Mon coloriage</strong><small id="saveStatus">Prêt à colorier</small></div>
      <div class="top-actions">
        <button class="action" id="undoButton" type="button">↶ Annuler</button>
        <button class="action" id="printButton" type="button">🖨 Imprimer</button>
        <button class="action primary" id="saveButton" type="button">☁ Sauvegarder</button>
      </div>
    </header>
    <div class="workspace">
      <aside class="tools" aria-label="Feutres numériques">
        <span class="tool-label">Couleurs</span>
        <div class="palette" id="palette">
          <button class="color active" style="--color:#ef6f9f" data-color="#ef6f9f" aria-label="Rose"></button>
          <button class="color" style="--color:#7d72df" data-color="#7d72df" aria-label="Violet"></button>
          <button class="color" style="--color:#4a92e8" data-color="#4a92e8" aria-label="Bleu"></button>
          <button class="color" style="--color:#4fc0a1" data-color="#4fc0a1" aria-label="Vert"></button>
          <button class="color" style="--color:#f0b53f" data-color="#f0b53f" aria-label="Jaune"></button>
          <button class="color" style="--color:#ed754d" data-color="#ed754d" aria-label="Orange"></button>
          <button class="color" style="--color:#8c563f" data-color="#8c563f" aria-label="Marron"></button>
          <button class="color" style="--color:#34345e" data-color="#34345e" aria-label="Bleu nuit"></button>
        </div>
        <span class="tool-label">Taille</span>
        <div class="sizes">
          <button class="size" style="--dot:5px" data-size="6" aria-label="Feutre fin"></button>
          <button class="size active" style="--dot:10px" data-size="14" aria-label="Feutre moyen"></button>
          <button class="size" style="--dot:15px" data-size="24" aria-label="Gros feutre"></button>
        </div>
        <button class="tool" id="eraserButton" type="button">🧽<br>Gomme</button>
        <button class="tool" id="clearButton" type="button">✨<br>Recommencer</button>
        <button class="tool finish" id="finishButton" type="button">⭐<br>Terminé</button>
      </aside>
      <section class="stage">
        <article class="paper" id="paper">
          <div class="loading" id="loading"><div><span>🖍️</span><strong>Préparation de l’atelier…</strong></div></div>
          <canvas id="baseCanvas" hidden></canvas>
          <canvas id="drawCanvas" hidden></canvas>
        </article>
      </section>
    </div>
  </main>

  <section class="choice" id="choice">
    <div class="choice-card">
      <div class="mascot"><img src="brand/assets/mascot-nour.png" alt="Mimi"></div>
      <h1>Que veux-tu faire ?</h1>
      <p>Choisis simplement ton activité.</p>
      <select class="child-select" id="childSelect" aria-label="Choisir l’enfant"></select>
      <div class="choice-buttons">
        <button class="choice-button" id="startColoring" type="button"><span>🖍️</span><strong>Colorier</strong><small>Avec mes feutres numériques</small></button>
        <button class="choice-button" id="quickPrint" type="button"><span>🖨️</span><strong>Imprimer</strong><small>Pour colorier sur papier</small></button>
      </div>
      <p class="choice-message" id="choiceMessage"></p>
    </div>
  </section>
  <img id="printOutput" alt="">
  <div class="toast" id="toast" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs" type="module"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./km-config.js"></script>
  <script src="./km-auth.js"></script>
  <script type="module">
    import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs";
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs";

    const params = new URLSearchParams(location.search);
    const source = params.get("src") || "";
    const title = (params.get("title") || "Mon coloriage").slice(0,160);
    const requestedFormat = params.get("format") || "";
    const requestedDraft = params.get("draft") || "";
    const allowedHost = "pasgxojzybmvbjhuokkk.supabase.co";
    const baseCanvas = document.getElementById("baseCanvas");
    const drawCanvas = document.getElementById("drawCanvas");
    const baseCtx = baseCanvas.getContext("2d");
    const drawCtx = drawCanvas.getContext("2d");
    const choice = document.getElementById("choice");
    const editorApp = document.getElementById("editorApp");
    const childSelect = document.getElementById("childSelect");
    const saveStatus = document.getElementById("saveStatus");
    let context = null;
    let sourceUrl = null;
    let format = "image";
    let childId = "";
    let draftId = requestedDraft;
    let strokes = [];
    let redoStack = [];
    let currentStroke = null;
    let color = "#ef6f9f";
    let size = 14;
    let erasing = false;
    let saveTimer = null;
    let saving = false;
    let initialized = false;

    const toast = text => {
      const element = document.getElementById("toast");
      element.textContent = text;
      element.hidden = false;
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => element.hidden = true,2200);
    };
    const validateSource = () => {
      sourceUrl = new URL(source);
      const valid = sourceUrl.protocol === "https:" && sourceUrl.hostname === allowedHost
        && sourceUrl.pathname.startsWith("/storage/v1/object/public/content-colorings/");
      if (!valid) throw new Error("Ce coloriage n’est pas disponible.");
      format = requestedFormat === "pdf" || sourceUrl.pathname.toLowerCase().endsWith(".pdf") ? "pdf" : "image";
      document.title = `${title} — Kawaii Muslim`;
      document.getElementById("coloringTitle").textContent = title;
    };
    const loadBase = async () => {
      if (initialized) return;
      if (format === "pdf") {
        const pdf = await pdfjsLib.getDocument(sourceUrl.href).promise;
        const page = await pdf.getPage(1);
        const first = page.getViewport({scale:1});
        const scale = Math.min(2,1400 / first.width);
        const viewport = page.getViewport({scale});
        baseCanvas.width = drawCanvas.width = Math.round(viewport.width);
        baseCanvas.height = drawCanvas.height = Math.round(viewport.height);
        await page.render({canvasContext:baseCtx,viewport}).promise;
      } else {
        const image = new Image();
        image.crossOrigin = "anonymous";
        await new Promise((resolve,reject) => {
          image.onload = resolve; image.onerror = reject; image.src = sourceUrl.href;
        });
        const scale = Math.min(1,1400 / image.naturalWidth);
        baseCanvas.width = drawCanvas.width = Math.round(image.naturalWidth * scale);
        baseCanvas.height = drawCanvas.height = Math.round(image.naturalHeight * scale);
        baseCtx.fillStyle = "#fff";
        baseCtx.fillRect(0,0,baseCanvas.width,baseCanvas.height);
        baseCtx.drawImage(image,0,0,baseCanvas.width,baseCanvas.height);
      }
      document.getElementById("loading").hidden = true;
      baseCanvas.hidden = drawCanvas.hidden = false;
      initialized = true;
    };
    const drawStroke = stroke => {
      if (!stroke?.points?.length) return;
      drawCtx.save();
      drawCtx.lineCap = "round";
      drawCtx.lineJoin = "round";
      drawCtx.lineWidth = stroke.size;
      drawCtx.globalCompositeOperation = stroke.eraser ? "destination-out" : "source-over";
      drawCtx.strokeStyle = stroke.color;
      drawCtx.beginPath();
      const [first,...rest] = stroke.points;
      drawCtx.moveTo(first[0],first[1]);
      if (!rest.length) drawCtx.lineTo(first[0]+.1,first[1]+.1);
      rest.forEach(point => drawCtx.lineTo(point[0],point[1]));
      drawCtx.stroke();
      drawCtx.restore();
    };
    const redraw = () => {
      drawCtx.clearRect(0,0,drawCanvas.width,drawCanvas.height);
      strokes.forEach(drawStroke);
    };
    const pointFromEvent = event => {
      const rect = drawCanvas.getBoundingClientRect();
      return [(event.clientX-rect.left)*drawCanvas.width/rect.width,(event.clientY-rect.top)*drawCanvas.height/rect.height];
    };
    const scheduleSave = () => {
      saveStatus.textContent = "Sauvegarde…";
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => saveDraft(),1100);
    };
    const saveDraft = async () => {
      if (saving || !childId || !initialized) return;
      saving = true;
      try {
        const saved = await KMAuth.saveArtworkDraft({
          id:draftId,childId,title,sourceUrl:sourceUrl.href,
          drawingData:{version:1,width:drawCanvas.width,height:drawCanvas.height,strokes}
        });
        draftId = saved.id;
        saveStatus.textContent = "Sauvegardé automatiquement";
      } catch (error) {
        saveStatus.textContent = "Sauvegarde à réessayer";
        toast(KMAuth.friendlyError(error));
      } finally { saving = false; }
    };
    const loadDraft = async () => {
      const draft = await KMAuth.findArtworkDraft({childId,sourceUrl:sourceUrl.href});
      if (!draft) return;
      draftId = draft.id;
      strokes = Array.isArray(draft.drawing_data?.strokes) ? draft.drawing_data.strokes : [];
      redraw();
      saveStatus.textContent = "Coloriage retrouvé";
    };
    const mergedDataUrl = () => {
      const output = document.createElement("canvas");
      output.width = baseCanvas.width; output.height = baseCanvas.height;
      const ctx = output.getContext("2d");
      ctx.drawImage(baseCanvas,0,0); ctx.drawImage(drawCanvas,0,0);
      return output.toDataURL("image/png");
    };
    const mergedBlob = async () => {
      const output = document.createElement("canvas");
      output.width = baseCanvas.width; output.height = baseCanvas.height;
      const ctx = output.getContext("2d");
      ctx.drawImage(baseCanvas,0,0); ctx.drawImage(drawCanvas,0,0);
      return new Promise(resolve => output.toBlob(resolve,"image/png"));
    };
    const printCurrent = async originalOnly => {
      await loadBase();
      document.getElementById("printOutput").src = originalOnly ? baseCanvas.toDataURL("image/png") : mergedDataUrl();
      setTimeout(() => window.print(),80);
    };
    const startEditor = async () => {
      childId = childSelect.value;
      if (!childId) return document.getElementById("choiceMessage").textContent = "Ajoute d’abord un profil enfant.";
      choice.hidden = true;
      editorApp.hidden = false;
      await loadBase();
      await loadDraft();
    };

    drawCanvas.addEventListener("pointerdown", event => {
      event.preventDefault();
      drawCanvas.setPointerCapture(event.pointerId);
      currentStroke = {color,size,eraser:erasing,points:[pointFromEvent(event)]};
      redoStack = [];
      drawStroke(currentStroke);
    });
    drawCanvas.addEventListener("pointermove", event => {
      if (!currentStroke) return;
      event.preventDefault();
      currentStroke.points.push(pointFromEvent(event));
      redraw(); drawStroke(currentStroke);
    });
    const endStroke = event => {
      if (!currentStroke) return;
      if (event) event.preventDefault();
      strokes.push(currentStroke);
      currentStroke = null;
      redraw();
      scheduleSave();
    };
    drawCanvas.addEventListener("pointerup",endStroke);
    drawCanvas.addEventListener("pointercancel",endStroke);
    document.getElementById("palette").addEventListener("click",event => {
      const button = event.target.closest("[data-color]");
      if (!button) return;
      color = button.dataset.color; erasing = false;
      document.querySelectorAll("[data-color]").forEach(item => item.classList.toggle("active",item===button));
      document.getElementById("eraserButton").classList.remove("active");
    });
    document.querySelector(".sizes").addEventListener("click",event => {
      const button = event.target.closest("[data-size]");
      if (!button) return;
      size = Number(button.dataset.size);
      document.querySelectorAll("[data-size]").forEach(item => item.classList.toggle("active",item===button));
    });
    document.getElementById("eraserButton").addEventListener("click",event => {
      erasing = !erasing; event.currentTarget.classList.toggle("active",erasing);
    });
    document.getElementById("undoButton").addEventListener("click",() => {
      const stroke = strokes.pop(); if (!stroke) return;
      redoStack.push(stroke); redraw(); scheduleSave();
    });
    document.getElementById("clearButton").addEventListener("click",() => {
      if (!strokes.length || !confirm("Effacer tous les feutres et recommencer ?")) return;
      redoStack.push(...strokes); strokes=[]; redraw(); scheduleSave();
    });
    document.getElementById("saveButton").addEventListener("click",async () => { await saveDraft(); toast("Ton coloriage est bien gardé ☁️"); });
    document.getElementById("printButton").addEventListener("click",() => printCurrent(false));
    document.getElementById("quickPrint").addEventListener("click",() => printCurrent(true));
    document.getElementById("startColoring").addEventListener("click",() => startEditor().catch(error => document.getElementById("choiceMessage").textContent=KMAuth.friendlyError(error)));
    document.getElementById("finishButton").addEventListener("click",async event => {
      const button = event.currentTarget;
      try {
        button.disabled = true; button.textContent = "⭐ Enregistrement…";
        await saveDraft();
        const blob = await mergedBlob();
        await KMAuth.completeArtwork({
          id:draftId,childId,imageBlob:blob,
          drawingData:{version:1,width:drawCanvas.width,height:drawCanvas.height,strokes}
        });
        window.location.href = `Atelier.dc.html?child=${encodeURIComponent(childId)}`;
      } catch (error) {
        toast(KMAuth.friendlyError(error));
        button.disabled=false; button.innerHTML="⭐<br>Terminé";
      }
    });
    window.addEventListener("beforeunload",() => { if (saveTimer) saveDraft(); });

    try {
      validateSource();
      context = await KMAuth.getContext();
      if (!context) window.location.replace(`Connexion.dc.html?next=${encodeURIComponent(location.pathname+location.search)}`);
      const active = KMAuth.getActiveProfile();
      childSelect.innerHTML = context.children.map(child => `<option value="${child.id}">${child.avatar} ${child.name}</option>`).join("");
      if (active.type === "child" && context.children.some(child => child.id === active.id)) childSelect.value = active.id;
      if (!context.children.length) {
        childSelect.hidden = true;
        document.getElementById("choiceMessage").innerHTML = 'Ajoute un profil enfant dans <a href="Compte.dc.html" style="color:#fff">Mon compte</a>.';
        document.getElementById("startColoring").disabled = true;
      }
      if (requestedDraft && childSelect.value) await startEditor();
    } catch (error) {
      document.getElementById("choiceMessage").textContent = KMAuth.friendlyError(error);
      document.getElementById("startColoring").disabled = true;
      document.getElementById("quickPrint").disabled = true;
    }
  </script>
</body>
</html>
