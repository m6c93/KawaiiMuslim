<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#20285e">
  <title>Mon compte — Kawaii Muslim</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./responsive.css">
  <link rel="stylesheet" href="./account.css">
</head>
<body>
  <div class="account-shell">
    <nav class="account-nav">
      <a class="account-brand" href="Bibliotheque%20Kawaii%20Muslim.dc.html">
        <img src="brand/assets/mascot-nour.png" alt="Mimi">
        <strong>Kawaii Muslim</strong>
      </a>
      <div class="nav-links">
        <a class="nav-link" href="Profils.dc.html">⇄ <span>Changer de profil</span></a>
        <a class="nav-link" href="Support.dc.html">❔ <span>Aide</span></a>
        <button class="ghost-button" id="logout" type="button">Déconnexion</button>
      </div>
    </nav>

    <main class="dashboard">
      <header class="page-head">
        <div>
          <h1 class="page-title" id="hello">Mon compte familial</h1>
          <p id="email"></p>
        </div>
        <span class="badge" id="roleBadge">Compte parent</span>
      </header>

      <div class="dashboard-grid">
        <section class="dash-card">
          <h2>Mon profil parent</h2>
          <form id="parentForm">
            <label class="field-label" for="parentName">Prénom</label>
            <input class="field-input" id="parentName" maxlength="60" required>
            <label class="field-label" for="parentAvatar">Mon symbole</label>
            <select class="field-select" id="parentAvatar">
              <option>🌸</option><option>🌙</option><option>🤍</option><option>🕊️</option><option>✨</option>
            </select>
            <button class="primary-button" type="submit">Enregistrer mon profil</button>
          </form>
        </section>

        <section class="dash-card">
          <h2>Ajouter un profil enfant</h2>
          <form id="childForm">
            <label class="field-label" for="childName">Prénom de l’enfant</label>
            <input class="field-input" id="childName" maxlength="40" placeholder="Exemple : Aya" required>
            <label class="field-label" for="childAge">Tranche d’âge</label>
            <select class="field-select" id="childAge">
              <option value="3-5">3 à 5 ans</option>
              <option value="6-8" selected>6 à 8 ans</option>
              <option value="9-12">9 à 12 ans</option>
              <option value="13+">13 ans et plus</option>
            </select>
            <label class="field-label" for="childAvatar">Petit symbole</label>
            <select class="field-select" id="childAvatar">
              <option>🐤</option><option>👧</option><option>👦</option><option>🧒</option><option>⭐</option><option>🌱</option>
            </select>
            <button class="primary-button pink" type="submit">Ajouter ce profil</button>
          </form>
        </section>

        <section class="dash-card full">
          <h2>Profils de mes enfants</h2>
          <div class="profile-list" id="children"><p class="loading">Chargement…</p></div>
          <p class="form-message" id="message"></p>
        </section>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./km-config.js"></script>
  <script src="./km-auth.js"></script>
  <script>
    let context = null;
    const children = document.getElementById("children");
    const message = document.getElementById("message");

    const escapeHtml = value => String(value).replace(/[&<>"']/g, character => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
    })[character]);

    const renderChildren = () => {
      children.innerHTML = context.children.map(child => `
        <article class="profile-card">
          <div class="profile-main">
            <span class="profile-avatar">${escapeHtml(child.avatar)}</span>
            <div class="profile-copy">
              <strong>${escapeHtml(child.name)}</strong>
              <small>${escapeHtml(child.age_group)} ans · progression personnelle</small>
            </div>
          </div>
          <div class="card-actions">
            <a class="small-button" href="Atelier.dc.html?child=${child.id}">🎨 Sa galerie</a>
            <button class="small-button danger" type="button" data-remove="${child.id}">Retirer</button>
          </div>
        </article>
      `).join("") || '<p class="loading">Aucun profil enfant. Tu peux en ajouter un juste au-dessus.</p>';
    };

    const load = async () => {
      context = await KMAuth.getContext();
      if (!context) {
        window.location.href = "Connexion.dc.html";
        return;
      }
      document.getElementById("hello").textContent = `Assalamou alaykoum${context.profile.full_name ? `, ${context.profile.full_name}` : ""} 🌸`;
      document.getElementById("email").textContent = context.profile.email;
      const roleLabels = {
        admin: "🛡️ Super-administratrice",
        support: "💬 Équipe support",
        content_admin: "📚 Équipe contenu",
        parent: "Compte parent"
      };
      document.getElementById("roleBadge").textContent = roleLabels[context.profile.role] || "Compte parent";
      document.getElementById("parentName").value = context.profile.full_name || "";
      document.getElementById("parentAvatar").value = context.profile.avatar || "🌸";
      renderChildren();
    };

    document.getElementById("parentForm").addEventListener("submit", async event => {
      event.preventDefault();
      try {
        await KMAuth.updateParent({
          fullName: document.getElementById("parentName").value,
          avatar: document.getElementById("parentAvatar").value
        });
        message.className = "form-message success";
        message.textContent = "Ton profil parent est enregistré.";
        await load();
      } catch (error) {
        message.className = "form-message";
        message.textContent = KMAuth.friendlyError(error);
      }
    });

    document.getElementById("childForm").addEventListener("submit", async event => {
      event.preventDefault();
      try {
        await KMAuth.addChild({
          name: document.getElementById("childName").value,
          ageGroup: document.getElementById("childAge").value,
          avatar: document.getElementById("childAvatar").value
        });
        event.target.reset();
        document.getElementById("childAge").value = "6-8";
        message.className = "form-message success";
        message.textContent = "Le profil enfant est créé avec douceur.";
        await load();
      } catch (error) {
        message.className = "form-message";
        message.textContent = KMAuth.friendlyError(error);
      }
    });

    children.addEventListener("click", async event => {
      const button = event.target.closest("[data-remove]");
      if (!button) return;
      if (!window.confirm("Retirer ce profil enfant et sa progression ?")) return;
      try {
        await KMAuth.removeChild(button.dataset.remove);
        await load();
      } catch (error) {
        message.textContent = KMAuth.friendlyError(error);
      }
    });

    document.getElementById("logout").addEventListener("click", async () => {
      await KMAuth.logout();
      window.location.href = "Connexion.dc.html";
    });

    load().catch(error => {
      children.innerHTML = "";
      message.textContent = KMAuth.friendlyError(error);
    });
  </script>
</body>
</html>
