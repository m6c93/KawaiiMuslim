name: Surveillance production

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-healthcheck
  cancel-in-progress: true

jobs:
  healthcheck:
    name: Vérifier le site et la connexion
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Vérifier la page de connexion
        run: |
          curl --fail --silent --show-error --location \
            --retry 2 --retry-all-errors --max-time 20 \
            --output /dev/null \
            "https://www.kawaiimuslimworld.com/Connexion.dc.html"

      - name: Vérifier Safe Place
        run: |
          curl --fail --silent --show-error --location \
            --retry 2 --retry-all-errors --max-time 20 \
            --output /dev/null \
            "https://www.kawaiimuslimworld.com/Safe%20Place.dc.html"

      - name: Vérifier le service de connexion Supabase
        run: |
          curl --fail --silent --show-error \
            --retry 2 --retry-all-errors --max-time 20 \
            --header "apikey: sb_publishable_JfiHxlqfI8pXr4Emho4vOw_QBePfSHm" \
            "https://pasgxojzybmvbjhuokkk.supabase.co/auth/v1/health"
