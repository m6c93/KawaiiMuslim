<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#171b45">
  <meta name="robots" content="noindex,nofollow">
  <title>Kawaii Muslim World — Archive préouverture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}
    body{font-family:Nunito,sans-serif;color:#fff;background:
      radial-gradient(circle at 18% 18%,rgba(240,174,202,.28),transparent 30%),
      radial-gradient(circle at 82% 24%,rgba(240,181,63,.18),transparent 26%),
      linear-gradient(155deg,#111735,#242b63 55%,#43356d);overflow-x:hidden}
    .stars{position:fixed;inset:0;pointer-events:none;opacity:.7;background-image:
      radial-gradient(circle,#fff 1px,transparent 1.5px),
      radial-gradient(circle,#f8d77a 1px,transparent 1.5px);background-size:74px 74px,113px 113px;background-position:12px 18px,40px 52px}
    main{position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;padding:32px}
    .card{width:min(680px,100%);text-align:center;padding:52px 38px;border:1px solid rgba(255,255,255,.16);border-radius:34px;background:rgba(16,21,52,.74);box-shadow:0 30px 80px rgba(5,8,30,.45);backdrop-filter:blur(14px)}
    .moon{font-size:58px;filter:drop-shadow(0 10px 20px rgba(240,181,63,.25))}
    .eyebrow{margin:20px 0 8px;color:#f7d987;font-weight:900;letter-spacing:.08em;text-transform:uppercase;font-size:13px}
    h1{font-family:"Baloo 2",sans-serif;font-size:clamp(38px,7vw,62px);line-height:1;margin:0 0 20px}
    p{max-width:520px;margin:0 auto;color:#dfe1f3;font-size:18px;line-height:1.7}
    .pill{display:inline-flex;align-items:center;gap:8px;margin-top:28px;padding:12px 20px;border-radius:999px;background:rgba(240,174,202,.16);color:#ffdbea;font-weight:800}
    .team{display:inline-block;margin-top:34px;color:#aeb2d4;font-size:12px;text-decoration:none}.team:hover{color:#fff}
    @media(max-width:520px){main{padding:18px}.card{padding:42px 22px;border-radius:26px}p{font-size:16px}}
  </style>
</head>
<body>
  <div class="stars"></div>
  <main>
    <section class="card">
      <div class="moon">🌙</div>
      <div class="eyebrow">Kawaii Muslim World</div>
      <h1>Notre univers se prépare…</h1>
      <p>Aya et Mimi mettent les dernières étoiles en place pour offrir aux familles un espace doux, sécurisé et rempli de belles découvertes islamiques.</p>
      <div class="pill">✨ Ouverture prochainement</div><br>
      <a class="team" href="Connexion.dc.html">Accès réservé à l’équipe</a>
    </section>
  </main>
</body>
</html>
