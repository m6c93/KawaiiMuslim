.brand{border:0;background:none;color:#fff;display:flex;gap:11px;align-items:center;text-align:left;cursor:pointer}.brand-mark{display:grid;place-items:center;width:40px;height:40px;border-radius:14px;color:var(--night);font-size:21px;background:var(--gold);box-shadow:0 0 24px rgba(255,226,122,.5)}.brand strong,.brand small{display:block}.brand strong{font-size:17px;letter-spacing:.02em}.brand small{color:#d7e4ff;font-size:12px;margin-top:1px}.actions{display:flex;gap:9px}.icon-btn,.close{width:42px;height:42px;border:1px solid rgba(255,255,255,.17);border-radius:13px;color:#fff;background:rgba(255,255,255,.08);cursor:pointer;transition:.2s}.icon-btn:hover,.close:hover{background:rgba(255,255,255,.18);transform:translateY(-1px)}
.reader{height:calc(100% - 76px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 20px 18px;position:relative;z-index:2}.book-shell{width:min(1080px,92vw);height:min(72vh,690px);display:flex;align-items:center;justify-content:center;gap:16px}.book{position:relative;height:100%;aspect-ratio:2/1;max-width:calc(100% - 120px);filter:drop-shadow(0 28px 35px rgba(0,0,0,.42));perspective:1800px;transform-style:preserve-3d}.cover-stage{height:100%;width:50%;margin-left:50%;position:relative;overflow:hidden;border-radius:4px 20px 20px 4px;box-shadow:inset 12px 0 18px rgba(0,0,0,.4);transform-origin:left center;animation:coverIn .8s cubic-bezier(.2,.8,.2,1)}.cover-image{position:absolute;inset:0;background-image:url("/brand/assets/cover-hijabi-girls.png");background-size:200% 100%;background-position:right center}.cover-shine{position:absolute;inset:0;background:linear-gradient(110deg,transparent 25%,rgba(255,255,255,.22) 47%,transparent 58%);transform:translateX(-120%);animation:shine 4s 1.1s infinite}.open-book{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;border:2px solid #17204b;border-radius:999px;background:#fff7dc;color:#17204b;font-weight:900;padding:12px 18px 12px 22px;cursor:pointer;white-space:nowrap;box-shadow:0 8px 24px rgba(5,12,37,.3);transition:.2s}.open-book b{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;background:var(--pink)}.open-book:hover{transform:translateX(-50%) translateY(-3px);box-shadow:0 12px 28px rgba(5,12,37,.42)}
.spread{height:100%;width:100%;position:relative;display:grid;grid-template-columns:1fr 1fr;perspective:1800px;animation:spreadIn .5s ease both}.paper{margin:0;height:100%;min-width:0;background:var(--paper);position:relative;overflow:hidden}.paper img{width:100%;height:100%;display:block;object-fit:contain;background:#fff}.left-paper{border-radius:12px 2px 2px 12px;box-shadow:inset -18px 0 24px rgba(25,25,25,.08)}.right-paper{border-radius:2px 12px 12px 2px;box-shadow:inset 18px 0 24px rgba(25,25,25,.08)}.paper figcaption{position:absolute;bottom:8px;color:#65708c;font:600 10px system-ui,sans-serif}.left-paper figcaption{left:12px}.right-paper figcaption{right:12px}.binding{position:absolute;z-index:4;left:50%;top:0;bottom:0;width:26px;transform:translateX(-50%);pointer-events:none;background:linear-gradient(90deg,transparent,rgba(0,0,0,.14) 48%,rgba(255,255,255,.25) 52%,transparent)}
.nav{flex:0 0 50px;width:50px;height:70px;border:1px solid rgba(255,255,255,.16);border-radius:18px;background:rgba(5,19,57,.6);color:#fff;font:300 45px/1 Georgia,serif;cursor:pointer;transition:.2s;backdrop-filter:blur(10px)}.nav:hover:not(:disabled){background:var(--gold);color:var(--night);transform:scale(1.05)}.nav:disabled{opacity:.2;cursor:default}.progress-wrap{width:min(750px,85vw);display:grid;grid-template-columns:110px 1fr 90px;align-items:center;gap:14px;margin-top:15px;font-size:12px;color:#dbe6ff}.progress-wrap span:last-child{text-align:right}.progress-wrap input{appearance:none;width:100%;height:5px;border-radius:99px;background:rgba(255,255,255,.22);outline:none}.progress-wrap input::-webkit-slider-thumb{appearance:none;width:18px;height:18px;border-radius:50%;background:var(--gold);border:4px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3);cursor:pointer}.hint{margin:9px 0 0;font-size:11px;color:#9cb0dd;letter-spacing:.03em}
.drawer{position:fixed;z-index:30;top:0;right:0;height:100%;width:min(520px,92vw);padding:28px;background:#faf7eb;color:var(--ink);transform:translateX(105%);transition:.35s cubic-bezier(.2,.8,.2,1);box-shadow:-30px 0 60px rgba(0,0,0,.35)}.drawer.open{transform:none}.drawer-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px}.drawer-head small{font-weight:900;letter-spacing:.15em;color:#d46699}.drawer h2{margin:5px 0;font-size:27px}.drawer .close{color:var(--ink);border-color:#ddd;background:#fff;font-size:25px}.thumbs{height:calc(100% - 80px);overflow:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:4px 5px 30px}.thumb{border:3px solid transparent;border-radius:12px;padding:0;background:#fff;overflow:hidden;cursor:pointer;box-shadow:0 4px 14px rgba(25,32,74,.1);transition:.2s;position:relative}.thumb:hover,.thumb.active{border-color:var(--pink);transform:translateY(-2px)}.thumb img{width:100%;display:block}.thumb span{position:absolute;right:5px;bottom:5px;background:rgba(7,25,71,.86);color:#fff;border-radius:7px;padding:3px 7px;font-size:10px}.scrim{position:fixed;z-index:25;inset:0;background:rgba(2,8,27,.65);backdrop-filter:blur(3px)}
.flip{position:absolute;top:0;height:100%;width:50%;z-index:40;transform-style:preserve-3d;will-change:transform}.flip.from-right{left:50%;transform-origin:left center}.flip.from-left{left:0;transform-origin:right center}.flip-face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff}.flip-face img{width:100%;height:100%;object-fit:contain;background:#fff}.flip.from-right .front{border-radius:2px 12px 12px 2px}.flip.from-right .back{transform:rotateY(180deg);border-radius:12px 2px 2px 12px}.flip.from-left .front{border-radius:12px 2px 2px 12px}.flip.from-left .back{transform:rotateY(180deg);border-radius:2px 12px 12px 2px}.flip-shade,.flip-gloss,.flip-back-shade{position:absolute;inset:0;pointer-events:none;opacity:0}.from-right .front .flip-shade{background:linear-gradient(90deg,transparent 30%,rgba(0,0,0,.22) 72%,rgba(0,0,0,.55) 96%)}.from-left .front .flip-shade{background:linear-gradient(270deg,transparent 30%,rgba(0,0,0,.22) 72%,rgba(0,0,0,.55) 96%)}.from-right .front .flip-gloss{background:linear-gradient(90deg,rgba(255,255,255,.22),rgba(255,255,255,.04) 26%,transparent 46%)}.from-left .front .flip-gloss{background:linear-gradient(270deg,rgba(255,255,255,.22),rgba(255,255,255,.04) 26%,transparent 46%)}.flip-back-shade{background:rgba(18,14,24,.5)}.leaf-cast{position:absolute;z-index:35;top:0;width:50%;height:100%;opacity:0;pointer-events:none;background:linear-gradient(var(--cast-direction),rgba(0,0,0,.38),transparent 62%)}
@keyframes coverIn{from{opacity:0;transform:translateY(18px) rotateY(-7deg)}to{opacity:1;transform:none}}@keyframes shine{0%,55%{transform:translateX(-120%)}75%,100%{transform:translateX(120%)}}@keyframes spreadIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@media(max-width:700px){.topbar{height:64px;padding:0 14px}.reader{height:calc(100% - 64px);padding:8px 8px 16px}.brand small{display:none}.book-shell{width:100%;height:min(70vh,620px);gap:6px}.book{aspect-ratio:1/1;max-width:calc(100% - 82px)}.cover-stage{width:100%;margin-left:0;border-radius:6px 18px 18px 6px}.cover-image{background-size:200% 100%;background-position:right}.spread{grid-template-columns:1fr}.paper{display:none}.paper.mobile-visible{display:block;border-radius:10px;box-shadow:none}.binding{display:none}.nav{width:38px;flex-basis:38px;height:58px;border-radius:14px}.progress-wrap{grid-template-columns:78px 1fr 62px;width:92vw;gap:8px}.hint{display:none}.thumbs{grid-template-columns:repeat(2,1fr)}.open-book{bottom:18px}.actions{gap:5px}.icon-btn{width:38px;height:38px}}

.save-left{left:12px}.save-right{right:12px}.paper:hover .save-page,.save-page:focus-visible{opacity:1}.save-page:hover{transform:translateY(-2px);background:#ffe27a}.save-page:active{transform:translateY(0)}

<body>
  <div class="stars" aria-hidden="true"></div>
  <header class="topbar">
    <a href="/Bibliotheque%20Kawaii%20Muslim.dc.html?guest=1" data-km-back title="Retour à la bibliothèque" style="text-decoration:none;display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:18px;margin-right:10px;flex-shrink:0;">🏠</a>
    <button class="brand" id="homeBtn" aria-label="Revenir à la couverture">
      <span class="brand-mark">✦</span>
      <span><strong>HIJABI GIRLS</strong><small>LIVRE NUMÉRIQUE · KAWAII MUSLIM</small></span>
    </button>
    <div class="actions">
      <button class="icon-btn" id="gridBtn" aria-label="Afficher toutes les pages" title="Toutes les pages">☷</button>
      <button class="icon-btn" id="soundBtn" aria-label="Activer ou désactiver le son" title="Son">♪</button>
      <button class="icon-btn" id="fullscreenBtn" aria-label="Plein écran" title="Plein écran">⛶</button>
    </div>
  </header>

  <main class="reader" id="reader">
    <section class="book-shell" aria-live="polite">
      <button class="nav prev" id="prevBtn" aria-label="Page précédente">‹</button>
      <div class="book" id="book">
        <div class="cover-stage" id="coverStage">
          <div class="cover-image" role="img" aria-label="Couverture du livre Hijabi Girls"></div>
          <div class="cover-shine"></div>
          <button class="open-book" id="openBtn"><span>Ouvrir le livre</span><b>→</b></button>
        </div>
        <div class="spread" id="spread" hidden>
          <figure class="paper left-paper" id="leftPaper">
            <img id="leftPage" alt="">
            <button class="save-page save-left" id="saveLeft" aria-label="Colorier la page gauche" title="Colorier cette page">⇩ <span>Colorier</span></button>
            <figcaption id="leftNumber"></figcaption>
          </figure>
          <div class="binding" aria-hidden="true"></div>
          <figure class="paper right-paper" id="rightPaper">
            <img id="rightPage" alt="">
            <button class="save-page save-right" id="saveRight" aria-label="Colorier la page droite" title="Colorier cette page">⇩ <span>Colorier</span></button>
            <figcaption id="rightNumber"></figcaption>
          </figure>
        </div>
      </div>
      <button class="nav next" id="nextBtn" aria-label="Page suivante">›</button>
    </section>

    <section class="progress-wrap" aria-label="Progression dans le livre">
      <span id="pageLabel">Couverture</span>
      <input id="progress" type="range" min="0" max="39" value="0" aria-label="Aller à une page">
      <span id="totalLabel">3 coloriages offerts</span>
    </section>
    <p class="hint">Utilise les flèches du clavier ou glisse la page du doigt</p>
  </main>

  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <div><small>SOMMAIRE VISUEL</small><h2>Toutes les pages</h2></div>
      <button class="close" id="closeDrawer" aria-label="Fermer">×</button>
    </div>
    <div class="thumbs" id="thumbs"></div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <script>
const PAGES = ["/brand/discovery/hijabi-1.jpg", "/brand/discovery/hijabi-2.jpg", "/brand/discovery/hijabi-3.jpg"];
const THUMBS = PAGES;
const TOTAL = 3;
const pad = n => String(n).padStart(2, "0");
const pageSrc = n => PAGES[n - 1] || "";
const thumbSrc = n => THUMBS[n - 1] || "";

const $ = id => document.getElementById(id);
const els = {
  book: $("book"), cover: $("coverStage"), spread: $("spread"), leftPaper: $("leftPaper"), rightPaper: $("rightPaper"),
  left: $("leftPage"), right: $("rightPage"), leftNo: $("leftNumber"), rightNo: $("rightNumber"),
  prev: $("prevBtn"), next: $("nextBtn"), progress: $("progress"), label: $("pageLabel"), drawer: $("drawer"),
  scrim: $("scrim"), thumbs: $("thumbs"), sound: $("soundBtn")
};

let position = Math.max(0, Math.min(TOTAL, Number(new URLSearchParams(location.search).get("page")) || 0));
let soundOn = true;
let touchX = 0;
let touchY = 0;
let touchGestureBlocked = false;
let flipping = false;
let queuedTurns = 0;
const isMobile = () => matchMedia("(max-width:700px)").matches;
let mobileMode = isMobile();
const maxPosition = () => isMobile() ? TOTAL : Math.ceil(TOTAL / 2);

function pageForPosition(pos) {
  if (!pos) return [0, 0];
  return isMobile() ? [pos, 0] : [(pos - 1) * 2 + 1, (pos - 1) * 2 + 2];
}

function render() {
  els.progress.max = maxPosition();
  els.progress.value = position;
  els.prev.disabled = position === 0;
  els.next.disabled = false;
  els.cover.hidden = position !== 0;
  els.spread.hidden = position === 0;
  els.book.style.aspectRatio = isMobile() ? "1/1" : "2/1";

  if (position === 0) {
    els.label.textContent = "Couverture";
  } else {
    const [a, b] = pageForPosition(position);
    els.left.src = pageSrc(a);
    els.left.alt = `Page ${a} du livre`;
    els.leftNo.textContent = a;
    els.right.hidden = b > TOTAL; if(b <= TOTAL) els.right.src = pageSrc(b); else els.right.removeAttribute("src");
    els.right.alt = b <= TOTAL ? `Page ${b} du livre` : "";
    els.rightNo.textContent = b <= TOTAL ? b : "";
    els.rightPaper.style.visibility = "visible"; els.rightPaper.classList.toggle("discovery-blank", b > TOTAL);
    els.leftPaper.classList.toggle("mobile-visible", isMobile());
    els.rightPaper.classList.remove("mobile-visible");
    els.label.textContent = b && b <= TOTAL ? `Coloriages ${a}–${b} / 3 offerts` : `Coloriage ${a} / 3 offert`;
  }
  document.querySelectorAll(".thumb").forEach((t, i) => t.classList.toggle("active", i + 1 === pageForPosition(position)[0]));
  preload(1);
}

function preload(direction = 1) {
  const next = Math.min(maxPosition(), Math.max(1, position + direction));
  pageForPosition(next).forEach(n => { if (n && n <= TOTAL) { const img = new Image(); img.src = pageSrc(n); } });
}

function softPageSound() {
  if (!soundOn) return;
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const buffer = ctx.createBuffer(1, ctx.sampleRate * .08, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / data.length) * .035;
    const src = ctx.createBufferSource(); src.buffer = buffer; src.connect(ctx.destination); src.start();
  } catch (_) {}
}

function go(next) {
  if(document.querySelector("dialog[open]"))return;
  if(next>maxPosition()){window.KMDiscovery.openUnlock();return;}
  if (flipping) {
    if (next > position) queuedTurns = Math.min(4, queuedTurns + 1);
    else if (next < position) queuedTurns = Math.max(-4, queuedTurns - 1);
    return;
  }
  const target = Math.max(0, Math.min(maxPosition(), next));
  if (target === position) return;
  const direction = target > position ? 1 : -1;
  softPageSound();
  const reduced = matchMedia("(prefers-reduced-motion:reduce)").matches;
  if (position === 0 || target === 0) {
    position = target;
    render();
    return;
  }
  const simpleChange = reduced || isMobile();
  if (simpleChange) {
    flipping = true;
    els.book.style.transition = "opacity .26s ease";
    els.book.style.opacity = "0";
    setTimeout(() => {
      position = target; render();
      requestAnimationFrame(() => els.book.style.opacity = "1");
      setTimeout(() => { els.book.style.transition = ""; flipping = false; }, 300);
    }, 200);
    return;
  }

  flipping = true;
  const [curLeft, curRight] = pageForPosition(position);
  const [nextLeft, nextRight] = pageForPosition(target);
  const frontPage = direction > 0 ? curRight : curLeft;
  const backPage = direction > 0 ? nextLeft : nextRight;
  if (direction > 0) {
    els.right.hidden = nextRight > TOTAL; if(nextRight <= TOTAL) els.right.src = pageSrc(nextRight); else els.right.removeAttribute("src");
    els.rightPaper.style.visibility = "visible"; els.rightPaper.classList.toggle("discovery-blank", nextRight > TOTAL);
  } else {
    els.left.src = pageSrc(nextLeft);
  }

  const leaf = document.createElement("div");
  leaf.className = `flip ${direction > 0 ? "from-right" : "from-left"}`;
  leaf.innerHTML = `<div class="flip-face front"><img src="${pageSrc(frontPage)}" alt="Page ${frontPage}"><div class="flip-shade"></div><div class="flip-gloss"></div></div><div class="flip-face back"><img src="${pageSrc(backPage)}" alt="Page ${backPage}"><div class="flip-back-shade"></div></div>`;
  const cast = document.createElement("div");
  cast.className = "leaf-cast";
  cast.style.left = direction > 0 ? "0" : "50%";
  cast.style.setProperty("--cast-direction", direction > 0 ? "270deg" : "90deg");
  els.book.append(leaf, cast);

  const shade = leaf.querySelector(".flip-shade");
  const gloss = leaf.querySelector(".flip-gloss");
  const backShade = leaf.querySelector(".flip-back-shade");
  const duration = 1250;
  backShade.style.opacity = ".55";
  leaf.style.transform = "rotateY(0deg)";
  void leaf.offsetWidth;
  const sign = direction > 0 ? -1 : 1;
  const turnAnimation = leaf.animate([
    {transform:"rotateY(0deg) scaleX(1)",offset:0},
    {transform:`rotateY(${sign * 38}deg) scaleX(.998)`,offset:.24},
    {transform:`rotateY(${sign * 88}deg) scaleX(.985)`,offset:.49},
    {transform:`rotateY(${sign * 94}deg) scaleX(.985)`,offset:.53},
    {transform:`rotateY(${sign * 145}deg) scaleX(.998)`,offset:.79},
    {transform:`rotateY(${sign * 180}deg) scaleX(1)`,offset:1}
  ], {duration,easing:"cubic-bezier(.34,.04,.26,1)",fill:"forwards"});
  shade.animate([{opacity:0},{opacity:.35},{opacity:1},{opacity:.45},{opacity:0}],{duration,fill:"forwards"});
  gloss.animate([{opacity:0},{opacity:.75},{opacity:1},{opacity:.2},{opacity:0}],{duration,fill:"forwards"});
  backShade.animate([{opacity:.55},{opacity:.5},{opacity:.18},{opacity:0}],{duration,fill:"forwards"});
  cast.animate([{opacity:0},{opacity:.25},{opacity:.7},{opacity:.25},{opacity:0}],{duration,fill:"forwards"});

  let finished = false;
  const finish = () => {
    if (finished) return;
    finished = true;
    position = target;
    try {
      render();
    } finally {
      leaf.remove();
      cast.remove();
      flipping = false;
      if (queuedTurns) {
        const queuedDirection = Math.sign(queuedTurns);
        queuedTurns -= queuedDirection;
        setTimeout(() => go(position + queuedDirection), 45);
      }
    }
  };
  turnAnimation.finished.then(finish).catch(finish);
  setTimeout(finish, duration + 140);
}

function buildThumbs() {
  if (els.thumbs.children.length) return;
  const fragment = document.createDocumentFragment();
  for (let n = 1; n <= TOTAL; n++) {
    const btn = document.createElement("button"); btn.className = "thumb"; btn.dataset.page = n;
    const visibleNumber = n;
    btn.innerHTML = `<strong>${`Coloriage ${visibleNumber}`}</strong><img decoding="async" alt="Miniature ${visibleNumber}"><span>${visibleNumber}</span>`;
    const image = btn.querySelector("img");
    image.addEventListener("load", () => btn.classList.add("loaded"), {once:true});
    image.addEventListener("error", () => image.remove(), {once:true});
    image.dataset.src = thumbSrc(n);
    btn.addEventListener("click", () => {
      const target = isMobile() ? n : Math.ceil(n / 2);
      if (flipping) setTimeout(() => go(target), 1250);
      else go(target);
      closeDrawer();
    });
    fragment.appendChild(btn);
  }
  els.thumbs.appendChild(fragment);
  const images = [...els.thumbs.querySelectorAll("img[data-src]")];
  let cursor = 0;
  const loadBatch = () => {
    images.slice(cursor, cursor + 10).forEach(image => {
      image.src = image.dataset.src;
      image.removeAttribute("data-src");
    });
    cursor += 10;
    if (cursor < images.length) setTimeout(loadBatch, 40);
  };
  loadBatch();
}

function openDrawer() { buildThumbs(); els.drawer.classList.add("open"); els.drawer.setAttribute("aria-hidden", "false"); els.scrim.hidden = false; }
function closeDrawer() { els.drawer.classList.remove("open"); els.drawer.setAttribute("aria-hidden", "true"); els.scrim.hidden = true; }

function savePage(side) {
  if (!position) return;
  const pages = pageForPosition(position), page=side === "right" ? pages[1] : pages[0];
  if(!page || page>TOTAL)return;
  const q=new URLSearchParams({guest:"1",src:"discovery-coloring:hijabi:"+page,title:"Hijabi Girls · Coloriage "+page,format:"image"});
  location.href="/Coloriage.dc.html?"+q;
}

$("openBtn").addEventListener("click", () => go(1));
$("homeBtn").addEventListener("click", () => go(0));
els.prev.addEventListener("click", () => go(position - 1));
els.next.addEventListener("click", () => go(position + 1));
els.progress.addEventListener("input", e => go(Number(e.target.value)));
$("gridBtn").addEventListener("click", openDrawer);
$("closeDrawer").addEventListener("click", closeDrawer);
els.scrim.addEventListener("click", closeDrawer);
$("saveLeft").addEventListener("click", () => savePage("left"));
$("saveRight").addEventListener("click", () => savePage("right"));
els.sound.addEventListener("click", () => { soundOn = !soundOn; els.sound.textContent = soundOn ? "♪" : "×"; els.sound.title = soundOn ? "Son activé" : "Son coupé"; });
$("fullscreenBtn").addEventListener("click", () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen());

document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight" || e.key === " ") go(position + 1);
  if (e.key === "ArrowLeft") go(position - 1);
  if (e.key === "Escape") closeDrawer();
});
els.book.addEventListener("touchstart", e => {
  if (e.touches.length !== 1) { touchGestureBlocked = true; return; }
  if (touchGestureBlocked) return;
  touchX = e.touches[0].clientX;
  touchY = e.touches[0].clientY;
}, {passive:true});
els.book.addEventListener("touchmove", e => {
  if (e.touches.length > 1) touchGestureBlocked = true;
}, {passive:true});
els.book.addEventListener("touchend", e => {
  if (touchGestureBlocked) {
    if (e.touches.length === 0) touchGestureBlocked = false;
    return;
  }
  const dx = e.changedTouches[0].clientX - touchX;
  const dy = e.changedTouches[0].clientY - touchY;
  if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.35) go(position + (dx < 0 ? 1 : -1));
}, {passive:true});
els.book.addEventListener("touchcancel", () => { touchGestureBlocked = false; }, {passive:true});
window.addEventListener("resize", () => {
  const nextMobileMode = isMobile();
  if (nextMobileMode !== mobileMode) {
    const currentPage = position ? (mobileMode ? position : (position - 1) * 2 + 1) : 0;
    position = currentPage ? (nextMobileMode ? currentPage : Math.ceil(currentPage / 2)) : 0;
    mobileMode = nextMobileMode;
  }
  render();
});

render();

</script>
