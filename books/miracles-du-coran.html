<body>
  <div class="sky" aria-hidden="true"></div>
  <header class="topbar">
    <a class="home" href="../Bibliotheque%20Kawaii%20Muslim.dc.html" aria-label="Retour à la bibliothèque">⌂</a>
    <div class="title"><strong>LES MIRACLES DU CORAN</strong><small>LIVRE INTERACTIF · AYA &amp; MIMI</small></div>
    <div class="actions">
      <button class="icon" id="gridBtn" type="button" aria-label="Voir toutes les pages" title="Toutes les pages">☷</button>
      <button class="icon" id="soundBtn" type="button" aria-label="Activer ou couper le son" title="Son">♪</button>
      <button class="icon" id="fullscreenBtn" type="button" aria-label="Plein écran" title="Plein écran">⛶</button>
    </div>
  </header>
  <main class="reader">
    <section class="book-shell" aria-live="polite">
      <button class="nav" id="prevBtn" type="button" aria-label="Page précédente">‹</button>
      <div class="book" id="book">
        <div class="cover-stage" id="coverStage">
          <div class="cover-image" role="img" aria-label="Couverture du livre Les Miracles du Coran"></div>

        </div>

          <div class="binding" aria-hidden="true"></div>
          <figure class="paper right-paper" id="rightPaper"><img id="rightPage" alt=""></figure>
        </div>
        <div class="turn-sheet" id="turnSheet" hidden aria-hidden="true">
          <div class="turn-face turn-front"><img id="turnFront" alt=""></div>
          <div class="turn-face turn-back"><img id="turnBack" alt=""></div>
        </div>
      </div>
      <button class="nav" id="nextBtn" type="button" aria-label="Page suivante">›</button>
    </section>
    <section class="progress-wrap" aria-label="Progression dans le livre">
      <span id="pageLabel">Couverture</span>
      <input class="progress" id="progress" type="range" min="0" value="0" aria-label="Aller à une page">
      <span id="totalLabel">64 pages</span>
    </section>
    <p class="hint">Utilise les flèches ou glisse la page du doigt</p>
  </main>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head"><div><small>SOMMAIRE VISUEL</small><h2>Toutes les pages</h2></div><button class="close" id="closeDrawer" type="button" aria-label="Fermer">×</button></div>
    <div class="thumbs" id="thumbs"></div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>
  <script>
    const TOTAL=window.KM_BOOK_EMBED?7:64, ASSET="../brand/books/miracles-du-coran/";
    const pad=n=>String(n).padStart(2,"0"), pageSrc=n=>`${ASSET}page-${pad(n)}.jpg`, $=id=>document.getElementById(id);
    const els={book:$("book"),cover:$("coverStage"),spread:$("spread"),leftPaper:$("leftPaper"),rightPaper:$("rightPaper"),left:$("leftPage"),right:$("rightPage"),turnSheet:$("turnSheet"),turnFront:$("turnFront"),turnBack:$("turnBack"),prev:$("prevBtn"),next:$("nextBtn"),progress:$("progress"),label:$("pageLabel"),drawer:$("drawer"),scrim:$("scrim"),thumbs:$("thumbs"),sound:$("soundBtn")};
    const activeProfile=(()=>{try{return JSON.parse(localStorage.getItem("km-active-profile-v2"))||{}}catch{return{}}})();
    const progressKey=`km-reading:miracles-du-coran:${activeProfile.id||"parent"}`;
    const queryPage=Number(new URLSearchParams(location.search).get("page"));
    let position=Math.max(0,Math.min(TOTAL,queryPage||Number(localStorage.getItem(progressKey))||0)),touchX=0,touchY=0,touchGestureBlocked=false,turning=false,soundOn=true,mobileMode=matchMedia("(max-width:700px)").matches;
    const isMobile=()=>matchMedia("(max-width:700px)").matches;
    const maxPosition=()=>isMobile()?TOTAL:(window.KM_BOOK_EMBED?1+Math.ceil((TOTAL-1)/2):Math.ceil(TOTAL/2));
    const pagesFor=pos=>!pos?[0,0]:isMobile()?[pos,0]:(window.KM_BOOK_EMBED?(pos===1?[0,1]:[(pos-1)*2,(pos-1)*2+1]):[(pos-1)*2+1,(pos-1)*2+2]);
    function renderBase(){
      position=Math.min(position,maxPosition());const[a,b]=pagesFor(position),mobile=isMobile();
      els.progress.max=maxPosition();els.progress.value=position;els.prev.disabled=position===0;els.next.disabled=position>=maxPosition();els.cover.hidden=position!==0;els.spread.hidden=position===0;els.book.style.aspectRatio=mobile?"1/1":"2/1";
      if(!position)els.label.textContent="Couverture";else{els.left.src=pageSrc(a);els.left.alt=`Page ${a} du livre`;els.right.src=b<=TOTAL?pageSrc(b):"";els.right.alt=b<=TOTAL?`Page ${b} du livre`:"";els.rightPaper.style.visibility=b<=TOTAL?"visible":"hidden";els.leftPaper.classList.toggle("mobile-visible",mobile);els.rightPaper.classList.remove("mobile-visible");els.label.textContent=b&&b<=TOTAL?`Pages ${a}–${b}`:`Page ${a}`}
      try{localStorage.setItem(progressKey,String(position))}catch{}
      document.querySelectorAll(".thumb").forEach((thumb,index)=>thumb.classList.toggle("active",index+1===a));
      const next=Math.min(maxPosition(),Math.max(1,position+1));pagesFor(next).forEach(n=>{if(n&&n<=TOTAL){const image=new Image();image.src=pageSrc(n)}});
    }
    function setEmbedPage(image,page){image.hidden=!page;if(page){image.src=pageSrc(page);image.alt=`Page ${page} du livre`}else{image.removeAttribute("src");image.alt=""}}
    function render(){
      if(!window.KM_BOOK_EMBED){renderBase();return}
      position=Math.min(position,maxPosition());const[a,b]=pagesFor(position),mobile=isMobile();
      els.progress.max=maxPosition();els.progress.value=position;els.prev.disabled=position===0;els.next.disabled=position>=maxPosition();els.cover.hidden=position!==0;els.spread.hidden=position===0;els.book.style.aspectRatio=mobile?"1/1":"2/1";
      if(!position)els.label.textContent="Couverture";else{setEmbedPage(els.left,a);setEmbedPage(els.right,b);els.leftPaper.style.visibility="visible";els.rightPaper.style.visibility="visible";els.leftPaper.classList.toggle("mobile-visible",mobile);els.rightPaper.classList.remove("mobile-visible");els.label.textContent=a&&b?`Pages ${a}–${b}`:`Page ${a||b}`}
    }
    function pageSound(){if(!soundOn)return;try{const ctx=new(window.AudioContext||window.webkitAudioContext)(),buffer=ctx.createBuffer(1,ctx.sampleRate*.06,ctx.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*(1-i/data.length)*.025;const src=ctx.createBufferSource();src.buffer=buffer;src.connect(ctx.destination);src.start()}catch{}}

      const target=Math.max(0,Math.min(maxPosition(),next));

      const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
      if(reduce||isMobile()||position===0||target===0){
        turning=true;
        els.book.style.transition="opacity .26s ease";
        els.book.style.opacity="0";
        setTimeout(()=>{
          position=target;
          render();
          setTimeout(()=>{els.book.style.opacity="1"},30);
          setTimeout(()=>{els.book.style.transition="";turning=false},300);

      leaf.innerHTML=`<div class="face front">${flipImage(frontPage)}<div class="shade"></div><div class="gloss"></div></div><div class="face back">${flipImage(backPage)}<div class="bshade"></div></div>`;
      els.book.appendChild(leaf);
      const shade=leaf.querySelector(".shade"),gloss=leaf.querySelector(".gloss"),bshade=leaf.querySelector(".bshade"),cast=document.createElement("div");
      cast.className="leaf-cast";
      cast.style.left=forward?"0":"50%";
      cast.style.setProperty("--cd",forward?"270deg":"90deg");
      els.book.appendChild(cast);
      bshade.style.opacity=".16";
      leaf.style.transform="rotateY(0deg)";
      void leaf.offsetWidth;
      const duration=1050,easing="cubic-bezier(.34,.04,.26,1)";
      leaf.style.transition=`transform ${duration}ms ${easing}`;
      shade.style.transition=gloss.style.transition=`opacity ${duration}ms ease`;
      bshade.style.transition=`opacity ${duration}ms ease`;
      cast.style.transition=`opacity ${duration}ms ease`;
      requestAnimationFrame(()=>{
        leaf.style.transform=`rotateY(${forward?-180:180}deg)`;
        shade.style.opacity=".38";
        gloss.style.opacity=".2";
        bshade.style.opacity="0";
        cast.style.opacity=".24";
        setTimeout(()=>{shade.style.opacity="0";gloss.style.opacity="0";cast.style.opacity="0"},Math.round(duration*.52));
      });
      let finished=false;
      const done=event=>{
        if(finished||(event&&event.target!==leaf))return;
        finished=true;
        leaf.removeEventListener("transitionend",done);
        position=target;
        render();
        leaf.remove();
        cast.remove();
        turning=false;
      };
      leaf.addEventListener("transitionend",done);
      setTimeout(()=>done(),duration+140);
    }
    function buildThumbs(){if(els.thumbs.children.length)return;const fragment=document.createDocumentFragment();for(let n=1;n<=TOTAL;n++){const btn=document.createElement("button");btn.className="thumb";btn.type="button";btn.innerHTML=`<img loading="lazy" src="${pageSrc(n)}" alt="Page ${n}"><span>${n}</span>`;btn.addEventListener("click",()=>{go(isMobile()?n:Math.ceil(n/2));closeDrawer()});fragment.appendChild(btn)}els.thumbs.appendChild(fragment)}
    function openDrawer(){buildThumbs();els.drawer.classList.add("open");els.drawer.setAttribute("aria-hidden","false");els.scrim.hidden=false}function closeDrawer(){els.drawer.classList.remove("open");els.drawer.setAttribute("aria-hidden","true");els.scrim.hidden=true}
    $("openBtn").addEventListener("click",()=>go(1));els.prev.addEventListener("click",()=>go(position-1));els.next.addEventListener("click",()=>go(position+1));els.progress.addEventListener("input",event=>go(Number(event.target.value)));$("gridBtn").addEventListener("click",openDrawer);$("closeDrawer").addEventListener("click",closeDrawer);els.scrim.addEventListener("click",closeDrawer);els.sound.addEventListener("click",()=>{soundOn=!soundOn;els.sound.textContent=soundOn?"♪":"×"});$("fullscreenBtn").addEventListener("click",()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen());
    document.addEventListener("keydown",event=>{if(event.key==="ArrowRight"||event.key===" ")go(position+1);if(event.key==="ArrowLeft")go(position-1);if(event.key==="Escape")closeDrawer()});
    els.book.addEventListener("touchstart",event=>{if(event.touches.length!==1){touchGestureBlocked=true;return}if(touchGestureBlocked)return;touchX=event.touches[0].clientX;touchY=event.touches[0].clientY},{passive:true});
    els.book.addEventListener("touchmove",event=>{if(event.touches.length>1)touchGestureBlocked=true},{passive:true});
    els.book.addEventListener("touchend",event=>{if(touchGestureBlocked){if(event.touches.length===0)touchGestureBlocked=false;return}const dx=event.changedTouches[0].clientX-touchX,dy=event.changedTouches[0].clientY-touchY;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.35)go(position+(dx<0?1:-1))},{passive:true});
    els.book.addEventListener("touchcancel",()=>{touchGestureBlocked=false},{passive:true});
    window.addEventListener("resize",()=>{const nextMobile=isMobile();if(nextMobile!==mobileMode){const page=position?(mobileMode?position:(position-1)*2+1):0;position=page?(nextMobile?page:Math.ceil(page/2)):0;mobileMode=nextMobile}render()});render();
  </script>
</body>
</html>
