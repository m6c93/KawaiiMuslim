<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
<script src="../book-touch-guard.js"></script>
<title>TAWAKKUL — Le livre numérique</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --cream:#FBF1DD; --paper:#FFFDF6; --ink:#4A3A44; --ink-soft:#7C6B74;
    --rose:#F0AECA; --rose-deep:#E27FAE; --rose-ink:#C25C8E; --rose-soft:#FBDDEA;
    --gold:#F0B53F; --gold-deep:#D8932A;
    --night:#141A3C; --night-2:#222C66; --night-3:#33419A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Nunito',system-ui,sans-serif;color:#fff;
    background:radial-gradient(130% 100% at 50% -20%, var(--night-3) 0%, var(--night-2) 42%, var(--night) 100%);
    overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none;-webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3,.dh{font-family:'Baloo 2',cursive;font-weight:800;letter-spacing:.4px}
  img{display:block;max-width:100%}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

  .stars{position:fixed;inset:0;pointer-events:none;z-index:0;background-image:
      radial-gradient(1.7px 1.7px at 12% 22%, #fff, transparent),
      radial-gradient(1.4px 1.4px at 68% 14%, #fff, transparent),
      radial-gradient(1.6px 1.6px at 38% 72%, #ffe9b8, transparent),
      radial-gradient(1.3px 1.3px at 86% 52%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 52% 36%, #fff, transparent),
      radial-gradient(1.2px 1.2px at 8% 62%, #fff, transparent),
      radial-gradient(1.4px 1.4px at 92% 84%, #ffe9b8, transparent),
      radial-gradient(1.3px 1.3px at 28% 10%, #fff, transparent),
      radial-gradient(1.6px 1.6px at 60% 86%, #fff, transparent),
      radial-gradient(1.2px 1.2px at 78% 30%, #fff, transparent),
      radial-gradient(1.4px 1.4px at 18% 88%, #fff, transparent);
    background-repeat:no-repeat;opacity:.7;animation:tw 6s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.45}50%{opacity:.9}}
  .moon{position:fixed;top:4.5vh;right:5vw;width:54px;height:54px;border-radius:50%;z-index:0;pointer-events:none;
    background:radial-gradient(circle at 38% 35%, #FFF6D6, #FAE08C 60%, #EFC65C);
    box-shadow:0 0 50px 10px rgba(250,224,140,.38), inset -7px -5px 0 rgba(214,160,60,.18)}

  .app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 18px}
  .brand{display:flex;align-items:center;gap:10px;font-family:'Baloo 2',cursive;font-weight:700;letter-spacing:.5px}
  .brand .logo{width:30px;height:30px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
  .brand .t{font-size:.98rem;line-height:1}
  .brand .t small{display:block;font-weight:600;font-size:.6rem;letter-spacing:2px;color:#CFD0E8;text-transform:uppercase;margin-top:2px}
  .tools{display:flex;align-items:center;gap:8px}
  .tool{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:1.02rem;
    background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.16);transition:background .15s, transform .15s}
  .tool:hover{background:rgba(255,255,255,.16);transform:translateY(-1px)}
  .tool.active{background:var(--rose-deep);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.3)}

  .stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;gap:clamp(6px,2.2vw,26px);padding:0 10px;min-height:0}
  .nav{flex:0 0 auto;width:clamp(44px,5vw,56px);height:clamp(44px,5vw,56px);border-radius:50%;
    background:rgba(255,255,255,.10);box-shadow:inset 0 0 0 1.6px rgba(255,255,255,.22), 0 10px 24px -14px #000;
    display:grid;place-items:center;color:#fff;transition:transform .15s, background .15s, opacity .2s;backdrop-filter:blur(4px)}
  .nav:hover{background:rgba(255,255,255,.2);transform:scale(1.06)}
  .nav:disabled{opacity:.22;cursor:default;transform:none}
  .nav svg{width:42%;height:42%}

  /* ---- open book : two square pages ---- */
  .book-wrap{position:relative;flex:0 1 auto;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}
  .book{position:relative;width:min(94vw, 170vh, 1480px);aspect-ratio:2 / 1;
    perspective:2600px;filter:drop-shadow(0 32px 56px rgba(0,0,0,.55))}
  .page{position:absolute;top:0;height:100%;width:50%;overflow:hidden;background:var(--paper)}
  .page.left{left:0;border-radius:10px 4px 4px 10px}
  .page.right{left:50%;border-radius:4px 10px 10px 4px}
  .page .pg-img{width:100%;height:100%;object-fit:cover}
  .page.left::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
    background:linear-gradient(270deg, rgba(0,0,0,.18), rgba(0,0,0,.02) 8%, transparent 16%)}
  .page.right::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;
    background:linear-gradient(90deg, rgba(0,0,0,.18), rgba(0,0,0,.02) 8%, transparent 16%)}
  .blankpage{width:100%;height:100%;background:radial-gradient(120% 120% at 50% 0%, #FFF7E4, #FBF1DD 60%, #F3E2C5)}
  .book.single{width:min(86vw, 82vh, 720px);aspect-ratio:1 / 1}
  .book.single .page{width:100%;left:0;border-radius:14px}
  .book.single .page.hidden{display:none}
  .book.single .page::after{display:none}

  .designed{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
    padding:8% 9%;color:var(--ink);background:radial-gradient(120% 90% at 50% 0%, #FFF7E4 0%, #FBF1DD 55%, #F6E6CD 100%)}
  .designed .grid-bg{position:absolute;inset:0;opacity:.5;pointer-events:none;
    background-image:linear-gradient(rgba(240,174,202,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(240,174,202,.35) 1px,transparent 1px);
    background-size:30px 30px}
  .designed .inner{position:relative}
  .designed .moonbig{width:74px;height:74px;border-radius:50%;margin:0 auto 14px;
    background:radial-gradient(circle at 38% 35%, #FFF6D6, #FAE08C 60%, #EFC65C);box-shadow:0 10px 26px -8px rgba(214,160,60,.5)}
  .designed .fin{font-family:'Baloo 2',cursive;font-weight:800;font-size:clamp(1.8rem,6vmin,2.8rem);
    background:linear-gradient(180deg,#F6CF6E,#D8932A);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:.2em}
  .designed p{color:var(--ink-soft);font-size:clamp(.9rem,2.2vmin,1.05rem);line-height:1.5;max-width:26ch;margin:0 auto .4em;text-wrap:pretty}
  .designed .sign{font-family:'Baloo 2',cursive;font-weight:700;color:var(--rose-deep);margin-top:.5em;font-size:1rem}
  .designed .logo{width:46px;height:46px;border-radius:50%;margin:14px auto 0;box-shadow:0 0 0 2px var(--rose-soft)}

  .flip{position:absolute;top:0;height:100%;width:50%;transform-style:preserve-3d;z-index:40;will-change:transform}
  .flip.fromRight{left:50%;transform-origin:left center}
  .flip.fromLeft{left:0;transform-origin:right center}
  .flip .face{position:absolute;inset:0;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper)}
  .flip .face .pg-img{width:100%;height:100%;object-fit:cover}
  .flip.fromRight .front{border-radius:4px 10px 10px 4px}
  .flip.fromRight .back{transform:rotateY(180deg);border-radius:10px 4px 4px 10px}
  .flip.fromLeft .front{border-radius:10px 4px 4px 10px}
  .flip.fromLeft .back{transform:rotateY(180deg);border-radius:4px 10px 10px 4px}
  .flip .shade,.flip .gloss,.flip .bshade{position:absolute;inset:0;pointer-events:none;opacity:0;border-radius:inherit}
  .flip.fromRight .front .shade{background:linear-gradient(90deg, rgba(0,0,0,0) 30%, rgba(0,0,0,.22) 72%, rgba(0,0,0,.55) 96%)}
  .flip.fromLeft  .front .shade{background:linear-gradient(270deg, rgba(0,0,0,0) 30%, rgba(0,0,0,.22) 72%, rgba(0,0,0,.55) 96%)}
  .flip.fromRight .front .gloss{background:linear-gradient(90deg, rgba(255,255,255,.22), rgba(255,255,255,.04) 26%, rgba(255,255,255,0) 46%)}
  .flip.fromLeft  .front .gloss{background:linear-gradient(270deg, rgba(255,255,255,.22), rgba(255,255,255,.04) 26%, rgba(255,255,255,0) 46%)}
  .flip .back .bshade{background:linear-gradient(0deg, rgba(18,14,24,.5), rgba(18,14,24,.5))}
  .leaf-cast{position:absolute;top:1.5%;height:97%;width:50%;z-index:30;pointer-events:none;opacity:0;filter:blur(9px);
    background:linear-gradient(var(--cd,90deg), rgba(0,0,0,.4), rgba(0,0,0,.12) 38%, rgba(0,0,0,0) 72%)}

  .zone{position:absolute;top:0;height:100%;width:36%;z-index:25;cursor:pointer}
  .zone.left{left:0;cursor:w-resize}.zone.right{right:0;cursor:e-resize}

  .bottom{display:flex;flex-direction:column;align-items:center;gap:9px;padding:6px 16px 14px}
  .hint{display:flex;align-items:center;gap:.5em;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
    padding:.4em 1em;border-radius:99px;font-weight:700;font-size:.8rem;color:#EDEafc;
    animation:hintpulse 2.4s ease-in-out infinite;transition:opacity .4s, max-height .4s, margin .4s;max-height:40px;overflow:hidden}
  @keyframes hintpulse{0%,100%{opacity:.6}50%{opacity:1}}
  .hint.hide{opacity:0;max-height:0;margin:-9px 0 0;padding-top:0;padding-bottom:0;pointer-events:none;animation:none}
  .counter{font-family:'Baloo 2',cursive;font-weight:700;letter-spacing:1px;color:#EDEafc;font-size:.92rem}
  .counter b{color:#FCE3B9}
  .progress{width:min(360px,70vw);height:6px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden}
  .progress .bar{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--rose),var(--gold));transition:width .35s ease}

  .thumbs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(16,20,46,.93);backdrop-filter:blur(10px);
    box-shadow:0 -10px 30px -16px #000;padding:12px 8px 14px;transform:translateY(110%);transition:transform .32s cubic-bezier(.4,0,.2,1)}
  .thumbs.open{transform:translateY(0)}
  .thumbs .row{display:flex;gap:9px;overflow-x:auto;padding:4px 14px 8px;scrollbar-width:thin}
  .thumbs .row::-webkit-scrollbar{height:7px}
  .thumbs .row::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:99px}
  .th{flex:0 0 auto;width:64px;height:64px;border-radius:11px;overflow:hidden;position:relative;cursor:pointer;
    box-shadow:inset 0 0 0 2px transparent;transition:transform .15s, box-shadow .15s;background:#222C66}
  .th img{width:100%;height:100%;object-fit:cover}
  .th .mini{width:100%;height:100%;display:grid;place-items:center;font-family:'Baloo 2',cursive;font-weight:800;color:#F6CF6E;font-size:.72rem;background:linear-gradient(180deg,#2A356F,#161C40)}
  .th:hover{transform:translateY(-3px)}
  .th.active{box-shadow:inset 0 0 0 2px var(--gold), 0 6px 16px -8px var(--gold)}
  .th .num{position:absolute;bottom:2px;right:3px;font-size:.56rem;font-weight:800;color:#fff;text-shadow:0 1px 2px #000}
  .thumbs .label{text-align:center;color:#CFD0E8;font-weight:700;font-size:.74rem;letter-spacing:1px;margin-bottom:2px}

  .rotate-hint{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:30;display:none;
    background:rgba(226,127,174,.92);color:#fff;font-weight:700;font-size:.8rem;padding:.5em 1em;border-radius:99px;
    align-items:center;gap:.5em;box-shadow:0 8px 20px -10px #000}
  .rotate-hint span{font-size:1.1em}

  @media (max-width:760px){
    .nav{width:40px;height:40px}
    .stage{gap:4px;padding:0 4px}
    .moon{width:42px;height:42px}
    .brand .t small{display:none}
    .book{width:min(96vw, 170vh, 1480px)}
  }
  @media (orientation:landscape) and (max-height:520px) and (max-width:980px){
    .topbar{
      flex:0 0 auto;
      min-height:58px;
      padding:max(10px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) 8px max(18px, env(safe-area-inset-left));
      position:relative;
      z-index:60;
    }
    [data-km-back]{margin-right:18px !important;flex:0 0 auto}
    .stage{
      padding:12px max(10px, env(safe-area-inset-right)) 4px max(10px, env(safe-area-inset-left));
    }
    .book{width:min(80vw, 138vh, 1480px)}
    .book.single{width:min(70vw, 70vh, 720px)}
  }
  @media (max-width:760px) and (orientation:portrait){ .rotate-hint{display:flex} }
  @media (prefers-reduced-motion:reduce){ .stars,.hint{animation:none} }
</style>
<script src="/km-discovery.js?v=discovery-2" defer></script>
</head>
<body>
<div class="stars" aria-hidden="true"></div>
<div class="moon" aria-hidden="true"></div>
<div class="rotate-hint"><span>↻</span> Tournez le téléphone pour mieux lire la double-page</div>

<div class="app">
  <div class="topbar">
    <a href="/Bibliotheque%20Kawaii%20Muslim.dc.html?guest=1" class="tool" data-km-back title="Retour à la bibliothèque" style="text-decoration:none;display:inline-flex;align-items:center;justify-content:center;margin-right:6px;">🏠</a>
    <div class="brand">
      <img class="logo" src="/brand/assets/logo-kawaii-muslim.png" alt="KawaiiMuslim" />
      <div class="t">TAWAKKUL<small>Livre numérique</small></div>
    </div>
    <div class="tools">
      <button class="tool" id="restart" title="Revenir à la couverture">↺</button>
      <button class="tool" id="thumbBtn" title="Toutes les pages">▦</button>
      <button class="tool" id="fsBtn" title="Plein écran">⛶</button>
    </div>
  </div>

  <div class="stage">
    <button class="nav prev" id="prev" aria-label="Page précédente">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>

    <div class="book-wrap">
      <div class="book" id="book">
        <div class="page left" id="pLeft"></div>
        <div class="page right" id="pRight"></div>
        <div class="zone left" id="zoneL" aria-label="Précédent"></div>
        <div class="zone right" id="zoneR" aria-label="Suivant"></div>
      </div>
    </div>

    <button class="nav next" id="next" aria-label="Page suivante">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>
  </div>

  <div class="bottom">
    <div class="hint" id="hint">👆 Touchez les bords (ou ←/→) pour feuilleter la double-page</div>
    <div class="counter" id="counter">Couverture</div>
    <div class="progress"><div class="bar" id="bar"></div></div>
  </div>
</div>

<div class="thumbs" id="thumbs">
  <div class="label">TOUTES LES PAGES</div>
  <div class="row" id="thumbRow"></div>
</div>

<script>
window.__PAGES = ["/brand/discovery/tawakkul-1.jpg", "/brand/discovery/tawakkul-2.jpg", "/brand/discovery/tawakkul-3.jpg", "/brand/discovery/tawakkul-4.jpg", "/brand/discovery/tawakkul-5.jpg"];
(function(){
  var FIN = { type:'html', html:
      '<div class="grid-bg"></div><div class="inner">'+
      '<div class="moonbig"></div>'+
      '<div class="fin">Fin 🌙</div>'+
      "<p>Qu'Allah remplisse le cœur de votre enfant de confiance et de paix.</p>"+
      "<div class=\"sign\">Avec tout notre amour,<br>l'équipe KawaiiMuslim 🤍</div>"+
      '<img class="logo" src="/brand/assets/logo-kawaii-muslim.png" alt="KawaiiMuslim" /></div>' };

  var leaves = [];
  var SRC = window.__PAGES || [];
  for(var i=0;i<SRC.length;i++){ leaves.push({ type:'image', src:SRC[i] }); }
  // Discovery includes only the five offered leaves.

  var PREVIEW_LIMIT = 5;
  if(PREVIEW_LIMIT){
    leaves = leaves.slice(0, Math.min(PREVIEW_LIMIT, leaves.length));
    document.documentElement.classList.add('limited-preview');
  }

  // spreads : cover alone, then pairs
  var spreads = [];
  spreads.push([null, 0]);
  for(var s=1; (2*s) <= leaves.length-1; s++){ spreads.push([2*s-1, 2*s]); }
  var lastPaired = spreads[spreads.length-1][1];
  if(lastPaired < leaves.length-1){ spreads.push([leaves.length-1, null]); }
  var NUM = spreads.length;

  var KEY=PREVIEW_LIMIT ? 'km-discovery-paid-reader:tawakkul' : 'tawakkul_book_spread_v2';
  var si=0;
  try{ var st=parseInt(localStorage.getItem(KEY)); if(!isNaN(st)&&st>=0&&st<NUM) si=st; }catch(e){}

  var book=document.getElementById('book');
  var pLeft=document.getElementById('pLeft');
  var pRight=document.getElementById('pRight');
  var prevBtn=document.getElementById('prev');
  var nextBtn=document.getElementById('next');
  var counter=document.getElementById('counter');
  var bar=document.getElementById('bar');
  var hint=document.getElementById('hint');
  var thumbs=document.getElementById('thumbs');
  var thumbRow=document.getElementById('thumbRow');

  function leafInner(li){
    if(li===null || li===undefined) return '<div class="blankpage"></div>';
    var p=leaves[li];
    if(p.type==='image') return '<img class="pg-img" src="'+p.src+'" alt="Page '+(li+1)+'" draggable="false" />';
    return '<div class="designed">'+p.html+'</div>';
  }
  function label(s){
    if(s<=0) return 'Couverture';
    if(spreads[s][1]===null) return 'Fin';
    var l=spreads[s][0], r=spreads[s][1];
    if(l!==null && r!==null && leaves[r].type==='html') return 'Dernière page';
    return 'Lecture ' + s + ' / ' + (NUM-1);
  }
  function preloadAround(s){
    for(var d=-1; d<=2; d++){ var sp=spreads[s+d]; if(!sp) continue;
      sp.forEach(function(li){ if(li!==null && leaves[li].type==='image'){ var im=new Image(); im.src=leaves[li].src; } }); }
  }
  function render(){
    var coverOnly = (spreads[si][0]===null || spreads[si][1]===null);
    book.classList.toggle('single', coverOnly);
    pLeft.classList.toggle('hidden', spreads[si][0]===null);
    pRight.classList.toggle('hidden', spreads[si][1]===null);
    pLeft.innerHTML = leafInner(spreads[si][0]);
    pRight.innerHTML = leafInner(spreads[si][1]);
    counter.textContent = 'Découverte · '+(Math.max(...spreads[si].filter(x=>x!==null))+1)+' / 5 pages offertes';
    bar.style.width = (NUM>1 ? (si/(NUM-1))*100 : 100) + '%';
    prevBtn.disabled = (si<=0);
    nextBtn.disabled = false;
    if(si!==0 && hint) hint.classList.add('hide');
    updateThumbsActive();
    preloadAround(si);
    try{ localStorage.setItem(KEY, String(si)); }catch(e){}
  }

  var flipping=false;
  function go(dir){
    if(document.querySelector('dialog[open]') || flipping) return;
    var target=si+dir;
    if(target>=NUM){window.KMDiscovery.openUnlock();return;} if(target<0) return;
    if(hint) hint.classList.add('hide');
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var single = (spreads[si][0]===null||spreads[si][1]===null||spreads[target][0]===null||spreads[target][1]===null);
    if(reduce || single){
      flipping=true;
      book.style.transition='opacity .26s ease'; book.style.opacity='0';
      setTimeout(function(){ si=target; render(); setTimeout(function(){ book.style.opacity='1'; }, 30); setTimeout(function(){ book.style.transition=''; flipping=false; }, 300); }, 200);
      return;
    }

    flipping=true;
    var cur=spreads[si], nxt=spreads[target];
    var leaf=document.createElement('div');
    leaf.className='flip '+(dir>0?'fromRight':'fromLeft');
    var frontLeaf, backLeaf;
    if(dir>0){ frontLeaf=cur[1]; backLeaf=nxt[0]; pRight.innerHTML=leafInner(nxt[1]); }
    else { frontLeaf=cur[0]; backLeaf=nxt[1]; pLeft.innerHTML=leafInner(nxt[0]); }
    leaf.innerHTML='<div class="face front">'+leafInner(frontLeaf)+'<div class="shade"></div><div class="gloss"></div></div>'+
                   '<div class="face back">'+leafInner(backLeaf)+'<div class="bshade"></div></div>';
    book.appendChild(leaf);
    var shade=leaf.querySelector('.shade'), gloss=leaf.querySelector('.gloss'), bshade=leaf.querySelector('.bshade');
    var cast=document.createElement('div'); cast.className='leaf-cast';
    cast.style.left = dir>0 ? '0' : '50%';
    cast.style.setProperty('--cd', dir>0 ? '270deg' : '90deg');
    book.appendChild(cast);
    bshade.style.opacity='.55';
    leaf.style.transform='rotateY(0deg)';
    void leaf.offsetWidth;
    var DUR=1050, EASE='cubic-bezier(.34,.04,.26,1)';
    leaf.style.transition='transform '+DUR+'ms '+EASE;
    shade.style.transition=gloss.style.transition='opacity '+DUR+'ms ease';
    bshade.style.transition='opacity '+DUR+'ms ease';
    cast.style.transition='opacity '+DUR+'ms ease';
    var endDeg = dir>0 ? -180 : 180;
    requestAnimationFrame(function(){
      leaf.style.transform='rotateY('+endDeg+'deg)';
      shade.style.opacity='1';
      gloss.style.opacity='1';
      bshade.style.opacity='0';
      cast.style.opacity='1';
      setTimeout(function(){ shade.style.opacity='0'; gloss.style.opacity='0'; cast.style.opacity='0'; }, Math.round(DUR*0.52));
    });
    var done=function(){
      leaf.removeEventListener('transitionend', done);
      si=target; render();
      if(leaf.parentNode) leaf.parentNode.removeChild(leaf);
      if(cast.parentNode) cast.parentNode.removeChild(cast);
      flipping=false;
    };
    leaf.addEventListener('transitionend', done);
    setTimeout(function(){ if(flipping) done(); }, DUR+140);
  }

  var thumbsBuilt=false;
  function buildThumbs(){
    leaves.forEach(function(p,i){
      var t=document.createElement('button');
      t.className='th'; t.dataset.i=i;
      if(p.type==='image'){ t.innerHTML='<img data-src="'+p.src+'" alt="" decoding="async" /><span class="num">'+(i+1)+'</span>'; }
      else { t.innerHTML='<div class="mini">Fin</div>'; }
      t.addEventListener('click', function(){
        var li=parseInt(t.dataset.i), to=0;
        for(var k=0;k<NUM;k++){ if(spreads[k][0]===li || spreads[k][1]===li){ to=k; break; } }
        if(to!==si){ si=to; render(); }
      });
      thumbRow.appendChild(t);
    });
  }
  function populateThumbs(){ if(thumbsBuilt) return; thumbsBuilt=true;
    thumbRow.querySelectorAll('img[data-src]').forEach(function(im){ im.src=im.getAttribute('data-src'); }); }
  function updateThumbsActive(){
    var ths=thumbRow.querySelectorAll('.th'); var cur=spreads[si];
    ths.forEach(function(t){ var li=parseInt(t.dataset.i); t.classList.toggle('active', li===cur[0]||li===cur[1]); });
    var act=thumbRow.querySelector('.th.active');
    if(act && thumbs.classList.contains('open')){ act.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'}); }
  }

  nextBtn.addEventListener('click', function(){ go(1); });
  prevBtn.addEventListener('click', function(){ go(-1); });
  document.getElementById('zoneR').addEventListener('click', function(){ go(1); });
  document.getElementById('zoneL').addEventListener('click', function(){ go(-1); });
  document.addEventListener('keydown', function(e){
    if(e.key==='ArrowRight'||e.key===' '){ e.preventDefault(); go(1); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); go(-1); }
    else if(e.key==='Home'){ si=0; render(); }
    else if(e.key==='End'){ si=NUM-1; render(); }
  });
  var sx=0,sy=0,sw=false,touchGestureBlocked=false;
  book.addEventListener('touchstart', function(e){ if(e.touches.length!==1){touchGestureBlocked=true;sw=false;return;} if(touchGestureBlocked)return; sx=e.touches[0].clientX; sy=e.touches[0].clientY; sw=true; }, {passive:true});
  book.addEventListener('touchmove', function(e){ if(e.touches.length>1){touchGestureBlocked=true;sw=false;} }, {passive:true});
  book.addEventListener('touchend', function(e){ if(touchGestureBlocked){if(e.touches.length===0)touchGestureBlocked=false;return;} if(!sw)return; sw=false; var dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy; if(Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)*1.35){ go(dx<0?1:-1); } }, {passive:true});
  book.addEventListener('touchcancel', function(){touchGestureBlocked=false;sw=false;}, {passive:true});

  document.getElementById('thumbBtn').addEventListener('click', function(){ var open=thumbs.classList.toggle('open'); this.classList.toggle('active', open); if(open){ populateThumbs(); updateThumbsActive(); } });
  document.getElementById('restart').addEventListener('click', function(){ si=0; render(); });
  document.getElementById('fsBtn').addEventListener('click', function(){
    var el=document.documentElement;
    if(!document.fullscreenElement){ (el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el); }
    else { (document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document); }
  });

  buildThumbs();
  render();
  setTimeout(function(){ if(hint) hint.classList.add('hide'); }, 5600);
})();
</script>
